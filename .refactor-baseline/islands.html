<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>harness islas reactivas</title>
    <style>
      html, body { margin: 0; background: #0b0b0b; color: #7CFC00; font: 13px/1.45 monospace; }
      iframe { width: 1440px; height: 900px; border: 0; background: #fff; position: absolute; left: -10000px; top: 0; }
      #out { white-space: pre-wrap; padding: 10px; }
    </style>
  </head>
  <body>
    <img src="/__hold__" alt="" style="position: absolute; left: -10000px" />
    <iframe id="nuevo"></iframe>
    <iframe id="original"></iframe>
    <pre id="out">corriendo…</pre>

    <script type="module">
      import { NETWORKS, urlConfig, DEFAULT_CHAIN_ID } from "../src/js/config/config.js";
      const CONTRATO = NETWORKS[31337].fund; // el harness conoce la dirección del contrato
      const CB = "?cb=" + Date.now();
      const frameNuevo = document.getElementById("nuevo");
      const frameOriginal = document.getElementById("original");
      frameNuevo.src = "/src/index.html" + CB;
      frameOriginal.src = "/.refactor-baseline/redesign-static.html" + CB;

      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      const NORM = (s) => String(s).replace(/\s+/g, " ").trim();

      // Oráculo del harness: lee balances(address) DIRECTO de la chain, sin
      // pasar por la app. Así se compara lo que muestra la UI contra la fuente,
      // y no contra un número que el propio test deja de valer al correr.
      const CONTRATO_JS = (await import("../src/js/config/config.js")).NETWORKS[31337].fund;
      const saldoOnChain = async (address) => {
        const r = await fetch("http://127.0.0.1:8545", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            jsonrpc: "2.0", id: 1, method: "eth_call",
            params: [{ to: CONTRATO_JS, data: "0x27e235e3" + address.slice(2).padStart(64, "0") }, "latest"],
          }),
        });
        const hex = (await r.json()).result;
        const wei = hex && hex !== "0x" ? BigInt(hex) : 0n;
        const entero = wei / 10n ** 18n;
        const dec = (wei % 10n ** 18n).toString().padStart(18, "0").replace(/0+$/, "");
        return dec ? `${entero}.${dec}` : `${entero}`;
      };

      const results = [];
      const check = (name, ok, extra = "") => results.push({ name, ok: Boolean(ok), extra });
      const eq = (name, actual, expected) =>
        check(name, Object.is(actual, expected) || NORM(actual) === NORM(expected), `obtuve «${actual}», esperaba «${expected}»`);
      const near = (name, actual, expected, eps = 0.0000005) =>
        check(name, Math.abs(Number(actual) - expected) <= eps, `obtuve ${actual}, esperaba ≈${expected}`);

      function whenLoaded(frame) {
        return new Promise((res) => {
          if (frame.contentDocument && frame.contentDocument.readyState === "complete") return res();
          frame.addEventListener("load", () => res(), { once: true });
          setTimeout(res, 15000);
        });
      }

      // Serializa ignorando formato; los hosts de web components se desenvuelven y
      // el subárbol dinámico se enmascara para poder comparar lo estático.
      function ser(node, mask) {
        if (node.nodeType === 3) {
          const t = node.textContent.replace(/\s+/g, " ");
          return t.trim() === "" ? "" : t;
        }
        if (node.nodeType !== 1) return "";
        const tag = node.tagName.toLowerCase();
        if (mask && (tag === "whiskito-donate-card" || node.classList.contains("donate-card"))) {
          return "<x-masked></x-masked>";
        }
        const inner = [...node.childNodes].map((n) => ser(n, mask)).join("");
        if (tag.includes("-")) return inner;
        const attrs = [...node.attributes]
          .map((a) => `${a.name}="${a.value.replace(/\s+/g, " ")}"`)
          .sort()
          .join(" ");
        return `<${tag}${attrs ? " " + attrs : ""}>${inner}</${tag}>`;
      }

      const typeInto = (input, value) => {
        input.value = value;
        input.dispatchEvent(new Event("input", { bubbles: true }));
      };

      (async () => {
        await Promise.all([whenLoaded(frameNuevo), whenLoaded(frameOriginal)]);
        await sleep(2500); // montaje + bootstrap de main.js

        try {
          // ── G1. Un `?chain=` desconocido no puede mezclar dos redes ────
          // Todo LOCAL y determinista: se lee la config, no se habla con ningún
          // RPC (nada del Amoy público). El invariante que se prueba es que el
          // `chainId` que devuelve `urlConfig()` es SIEMPRE el de la config que
          // devuelve: nunca el de una red con el `fund`/`rpc` de otra.
          const ANVIL_CFG = NETWORKS[31337];
          const AMOY_CFG = NETWORKS[80002];
          const OV_RPC = "http://127.0.0.1:9999";
          const OV_FUND = "0x1111111111111111111111111111111111111111";
          const Q_DESCONOCIDO = "?chain=99999";
          const Q_MIXTO = `?chain=99999&rpc=${OV_RPC}&fund=${OV_FUND}`;
          const casosG1 = [
            { q: Q_DESCONOCIDO, red: 31337, rpc: ANVIL_CFG.rpc, fund: ANVIL_CFG.fund },
            { q: "?chain=abc", red: 31337, rpc: ANVIL_CFG.rpc, fund: ANVIL_CFG.fund },
            { q: "?chain=8002", red: 31337, rpc: ANVIL_CFG.rpc, fund: ANVIL_CFG.fund },
            { q: Q_MIXTO, red: 31337, rpc: OV_RPC, fund: OV_FUND },
            { q: "?chain=31337", red: 31337, rpc: ANVIL_CFG.rpc, fund: ANVIL_CFG.fund },
            { q: "?chain=80002", red: 80002, rpc: AMOY_CFG.rpc, fund: AMOY_CFG.fund },
            { q: `?rpc=${OV_RPC}`, red: 31337, rpc: OV_RPC, fund: ANVIL_CFG.fund },
          ];
          const incoherentesG1 = casosG1.filter(({ q, red, rpc, fund }) => {
            const cfg = urlConfig(q);
            return !cfg || cfg.chainId !== red || cfg.rpc !== rpc || cfg.fund !== fund;
          }).map(({ q }) => {
            const cfg = urlConfig(q);
            return `${q} → chainId=${cfg?.chainId} rpc=${cfg?.rpc} fund=${cfg?.fund}`;
          });
          check("G1a ningún `?chain=` devuelve un chainId con el fund/rpc de otra red",
            incoherentesG1.length === 0, incoherentesG1.join(" | "));
          eq("G1b un `?chain=` desconocido cae a la red del ORIGEN (anvil 31337)",
            urlConfig(Q_DESCONOCIDO).chainId, DEFAULT_CHAIN_ID);
          check("G1c y con la config ENTERA de esa red: chainId, rpc y fund son los de anvil",
            urlConfig(Q_DESCONOCIDO).chainId === 31337 &&
              urlConfig(Q_DESCONOCIDO).rpc === ANVIL_CFG.rpc &&
              urlConfig(Q_DESCONOCIDO).fund === ANVIL_CFG.fund,
            `chainId=${urlConfig(Q_DESCONOCIDO).chainId} rpc=${urlConfig(Q_DESCONOCIDO).rpc} fund=${urlConfig(Q_DESCONOCIDO).fund}`);
          check("G1d `?chain=abc` (no numérico) cuenta como desconocido",
            urlConfig("?chain=abc").chainId === 31337 &&
              urlConfig("?chain=abc").fund === ANVIL_CFG.fund,
            `chainId=${urlConfig("?chain=abc").chainId} fund=${urlConfig("?chain=abc").fund}`);
          check("G1e `?chain=8002` (typo de 80002) también",
            urlConfig("?chain=8002").chainId === 31337 &&
              urlConfig("?chain=8002").fund === ANVIL_CFG.fund,
            `chainId=${urlConfig("?chain=8002").chainId} fund=${urlConfig("?chain=8002").fund}`);
          check("G1f `?rpc=`/`?fund=` explícitos se conservan (son perillas independientes)",
            urlConfig(Q_MIXTO).rpc === OV_RPC && urlConfig(Q_MIXTO).fund === OV_FUND,
            `rpc=${urlConfig(Q_MIXTO).rpc} fund=${urlConfig(Q_MIXTO).fund}`);
          // Sin NINGUNO de los tres params no hay override; y un param que no es
          // ninguno de los tres tampoco es un override (`?foo=bar`).
          check("G1g sin ningún param (ni con un param ajeno, `?foo=bar`) no hay override",
            urlConfig("") === null && urlConfig("?foo=bar") === null,
            `""→${urlConfig("")} "?foo=bar"→${urlConfig("?foo=bar")}`);
          // Los valores REALES de Amoy van como LITERALES a propósito: si se
          // compararan contra `NETWORKS[80002]`, un `fund` (o un `rpc`) mal
          // escrito en `src/js/config/config.js` pasaría —la config se compararía
          // consigo misma—. Con literales, el typo rompe esta aserción.
          const AMOY_FUND_REAL = "0xc92b0cAB9Bd6247250d483613B804593c7f3fEF8";
          const AMOY_RPC_REAL = "https://polygon-amoy-bor-rpc.publicnode.com";
          check("G1h `?chain=80002` sigue devolviendo Amoy COMPLETA (fund y rpc reales, nada más cambió)",
            urlConfig("?chain=80002").chainId === 80002 &&
              urlConfig("?chain=80002").rpc === AMOY_RPC_REAL &&
              urlConfig("?chain=80002").fund === AMOY_FUND_REAL,
            `chainId=${urlConfig("?chain=80002").chainId} rpc=${urlConfig("?chain=80002").rpc} fund=${urlConfig("?chain=80002").fund}`);
          // Y la red EFECTIVA de la app (no sólo la config): una página pedida
          // con `?chain=99999` tiene que trabajar contra anvil, con el contrato
          // de anvil y su rpc.
          const frameG1 = document.createElement("iframe");
          frameG1.style.cssText = "width:1440px;height:900px;border:0;position:absolute;left:-10000px";
          frameG1.src = `/src/index.html?cb=${Date.now()}&chain=99999`;
          document.body.append(frameG1);
          await new Promise((res) => frameG1.addEventListener("load", res, { once: true }));
          await sleep(1800);
          const winG1 = frameG1.contentWindow;
          const redEfectivaG1 = await winG1.eval(
            '(async () => (await import("/src/js/solidity/chain.js")).getActiveNetwork())()'
          );
          check("G1i con `?chain=99999` la app trabaja contra la red del origen (anvil 31337)",
            redEfectivaG1?.chainId === 31337 &&
              redEfectivaG1?.fund === ANVIL_CFG.fund &&
              redEfectivaG1?.rpc === ANVIL_CFG.rpc,
            `chainId=${redEfectivaG1?.chainId} fund=${redEfectivaG1?.fund} rpc=${redEfectivaG1?.rpc}`);

          const win = frameNuevo.contentWindow;
          const doc = win.document;
          // El MISMO módulo de la frontera que usa la app, para interactuar con
          // las islas por su API (y no por el DOM del documento): es el equivalente
          // de `main.js` inyectando datos.
          const islandsWin = await import("/src/js/dom/islands.js");
          // El camino PÚBLICO de lectura: el mismo que usa el flujo para pintar
          // el panel (no se toca el DOM de la isla a mano).
          // Las islas y su frontera (islands.js) viven en el realm de la app, que
          // acá adentro es OTRO: los módulos de este harness corren en la página
          // de afuera (el iframe tiene su propio importmap y su propio grafo).
          // Así que lo que se pide es en SU realm, con `win.eval` (mismo origen),
          // y la respuesta se serializa: es darle a la app las propiedades que le
          // daría su propio `main.js`, no tocarle el DOM desde afuera.
          const enLaApp = async (codigo, arg) => {
            const cuerpo = `(async () => { const arg = ${JSON.stringify(arg)}; ${codigo} })()`;
            const res = await win.eval(cuerpo);
            if (res && res.__error) throw new Error(res.__error);
            return res ? res.valor : undefined;
          };
          const cargarPanel = async (dir) => enLaApp(
            `const islands = await import("/src/js/dom/islands.js");
             const { readPortfolio } = await import("/src/js/solidity/solidity-functions.js");
             islands.showPortfolio(await readPortfolio(arg));`,
            dir,
          );
          const origWin = frameOriginal.contentWindow;
          const origDoc = origWin.document;

          const card = doc.querySelector("whiskito-donate-card");
          const navbar = doc.querySelector("whiskito-navbar");
          const panel = doc.querySelector("whiskito-panel");
          const cardRoot = card.shadowRoot ?? card;
          const navRoot = navbar.shadowRoot ?? navbar;
          const panelRoot = panel.shadowRoot ?? panel;
          const input = cardRoot.querySelector("#ehtAmount");
          const usd = cardRoot.querySelector("#usdEquivalent");
          const fund = cardRoot.querySelector("#fundButton");
          // El chip de 5 USD tiene que pedir 5/precio ETH: la cuenta la hace la isla.
          const ethDe = (usd) => String(Math.ceil((usd / card.ethPrice) * 1e6) / 1e6);
          const txStatus = cardRoot.querySelector("#txStatus");
          const txText = cardRoot.querySelector("#txText");
          const hint = cardRoot.querySelector("#cardHint");
          const chips = [...cardRoot.querySelectorAll(".chip")];
          const connect = navRoot.querySelector("#connectButton");
          // El botón contiene el label Y el chip de la dirección: se mira sólo el label.
          const etiqueta = () => NORM(connect.querySelector("span[data-text]").textContent);
          const navAccount = navRoot.querySelector(".nav-account");
          const balance = panelRoot.querySelector("#balanceDisplay");
          const balanceUsd = panelRoot.querySelector("#balanceUsd");
          const empty = panelRoot.querySelector(".r-empty");
          const rows = () => [...panelRoot.querySelectorAll("#donationsList .r-item")];

          // ── A. Montaje y datos inyectados por main.js ──────────────
          const hosts = [...doc.querySelectorAll("*")].filter((e) => e.tagName.includes("-"));
          check("A1 montados los 10 componentes", hosts.length === 10, `hosts=${hosts.length}`);
          check("A2 cada host montado: contenido en light DOM o en su shadow root",
            hosts.every((h) => (h.shadowRoot ? h.shadowRoot.children.length >= 1 : h.children.length === 1)),
            hosts.map((h) => `${h.tagName}:${h.shadowRoot ? "shadow" : h.children.length}`).join(" "));
          check("A3 elementos nuevos: hint/nav-account/pd-empty", Boolean(hint && navAccount && empty));
          // El precio lo lee main.js del contrato: con el MockV3Aggregator del
          // deploy local son 2000 USD. Si esto diera 3400, estaría usando el
          // valor de ejemplo (o sea: no llegó a la chain).
          const PRECIO = card.ethPrice;
          check("A4 el precio viene de la chain", PRECIO === 2000, `ethPrice=${PRECIO}`);
          check("A4b el precio NO es el de ejemplo (no cayó en el fallback)", PRECIO !== 3400, `ethPrice=${PRECIO}`);

          check("A5 main.js inyectó donaciones", panel.donations.length === 3, `len=${panel.donations.length}`);
          eq("A6 el panel pintó las 3 filas", rows().length, 3);
          eq("A7 balance pintado", balance.textContent, "0.0842");
          eq("A8 balance en USD pintado", balanceUsd.textContent, "≈ $269.44 USD");

          // ── F. Las secciones estáticas no derivaron ───────────────
          // Ancla: `redesign-static.html`, copia CONGELADA del markup estático
          // tal como quedó con el rediseño "Blues Poster '62". El ancla anterior
          // (`index.html`, el diseño previo al rediseño) quedó obsoleta a propósito: el
          // rediseño cambia el markup de las 5 secciones, así que comparar contra
          // ella sólo diría "cambió el diseño", que es lo que se pidió. Lo que
          // esta comparación sigue cuidando es que una sección estática no se
          // mueva DESPUÉS de congelada.
          // Se emparejan por un selector propio de cada sección: agregar
          // secciones nuevas no tiene que romper esta comparación.
          const ESTATICAS = [
            ["F1 hero", "whiskito-hero .hero", ".hero"],
            ["F2 cómo funciona (sin la tarjeta)", "whiskito-how-it-works #como-funciona", "#como-funciona"],
            ["F3 seguridad", "whiskito-trust .trust-grid", ".trust-grid"],
            ["F4 preguntas", "whiskito-faq #faq", "#faq"],
            ["F5 footer", "whiskito-footer .footer", ".footer"],
          ];
          for (const [name, selNuevo, selViejo] of ESTATICAS) {
            const elNuevo = doc.querySelector(selNuevo);
            const elViejo = origDoc.querySelector(selViejo);
            const a = elNuevo ? ser(elNuevo, true) : "(no está)";
            const b = elViejo ? ser(elViejo, true) : "(no está)";
            const distinto = [...a].findIndex((c, k) => c !== b[k]);
            check(name, a === b, a === b ? "" : `distinto en ${distinto} :: A=${a.slice(0, 80)} B=${b.slice(0, 80)}`);
          }

          // ── B. Isla de donación ───────────────────────────────────
          eq("B1 equivalente inicial", usd.textContent, "≈ $0.00 USD");
          check("B2 botón deshabilitado sin monto", fund.disabled === true);
          check("B3 estado de tx oculto", txStatus.hidden === true);
          check("B4 hint oculto", hint.hidden === true);
          check("B5 chips habilitados (hay precio)", chips.every((c) => !c.disabled));

          typeInto(input, "0.001");
          eq("B6 equivalente al tipear 0.001", usd.textContent, `≈ $${(0.001 * PRECIO).toFixed(2)} USD`);
          check("B7 botón habilitado con monto válido", fund.disabled === false);
          eq("B8 el atributo es el estado", card.getAttribute("amount"), "0.001");

          chips.find((c) => c.dataset.usd === "5").click();
          eq("B9 chip de 5 USD → ETH redondeado hacia arriba", card.amount, ethDe(5));
          eq("B10 el input refleja el estado", input.value, ethDe(5));
          check("B11 chip activo", chips.find((c) => c.dataset.usd === "5").classList.contains("is-active"));
          check("B12 sólo un chip activo", chips.filter((c) => c.classList.contains("is-active")).length === 1);

          chips.find((c) => c.dataset.usd === "0.5").click();
          // El piso bajó a 0.01 USD: este chip sigue siendo un monto válido (el
          // monto convertido es lo que se compara), ya no el mínimo exacto.
          eq("B13 chip de 0.5 USD → monto convertido", card.amount, ethDe(0.5));
          check("B14 con el mínimo no avisa", hint.hidden === true && fund.disabled === false);

          // Por debajo del piso NUEVO (0.01 USD): con el oráculo en 2000 USD el
          // mínimo en la unidad nativa es ethDe(0.01) = 0.000005, así que el
          // valor tipeado tiene que ser menor que eso (0.00001 ya NO está por
          // debajo: son 0.02 USD y la aserción dejaría de probar lo que dice).
          typeInto(input, "0.000001");
          check("B15 bajo el mínimo deshabilita", fund.disabled === true);
          check("B16 bajo el mínimo muestra el hint", hint.hidden === false);
          check("B17 el hint explica el mínimo",
            NORM(hint.textContent) === `El mínimo es 0.01 USD ≈ ${ethDe(0.01)} POL`, NORM(hint.textContent));

          let amountEvent = null;
          doc.addEventListener("whiskito:amount-change", (e) => { amountEvent = e.detail; });
          typeInto(input, "0.002");
          check("B18 emite whiskito:amount-change", amountEvent !== null);
          near("B19 detail.amount", amountEvent?.amount, 0.002);
          near("B20 detail.usd", amountEvent?.usd, 0.002 * PRECIO);

          let fundEvent = null;
          doc.addEventListener(
            "whiskito:fund-request",
            (e) => {
              fundEvent = e.detail;
              e.stopPropagation(); // aísla esta aserción del flujo real de main.js
            },
            { capture: true, once: true }, // una sola vez: el test E necesita el flujo real
          );
          fund.click();
          check("B21 emite whiskito:fund-request", fundEvent !== null);
          near("B22 detail.usd del pedido", fundEvent?.usd, 0.002 * PRECIO);

          card.removeAttribute("eth-price");
          check("B23 sin precio los chips quedan inertes", chips.every((c) => c.disabled === true));
          card.ethPrice = PRECIO; // se restaura el que se leyó de la chain
          check("B24 vuelve el precio y se reactivan", chips.every((c) => !c.disabled));

          card.status = "pending";
          check("B25 pending muestra el estado", txStatus.hidden === false);
          eq("B26 texto por defecto de pending", txText.textContent, "Procesando transacción...");
          check("B27 pending deshabilita el botón", fund.disabled === true);
          card.status = "success";
          card.message = "listo";
          eq("B28 message manda sobre el texto por defecto", txText.textContent, "listo");
          check("B29 clase tx-success", txStatus.classList.contains("tx-success"));
          card.message = "";
          eq("B30 texto por defecto de success", txText.textContent, "¡Whiskito enviado!");
          card.status = "error";
          check("B31 clase tx-error", txStatus.classList.contains("tx-error") && !txStatus.classList.contains("tx-success"));
          card.status = "idle";
          check("B32 vuelve a ocultarse", txStatus.hidden === true);

          // ── C. Isla del navbar ────────────────────────────────────
          eq("C1 label inicial", etiqueta(), "Conectar Wallet");
          check("C2 sin dirección, el chip está oculto", navAccount.hidden === true);
          check("C3 botón habilitado", connect.disabled === false);

          connect.click();
          await sleep(400);
          eq("C4 sin wallet → estado unsupported", navbar.connectionState, "unsupported");
          eq("C5 label de unsupported", etiqueta(), "Sin wallet detectada");
          check("C6 title explicativo", NORM(connect.getAttribute("title")) === "No detectamos una wallet en este navegador");

          navbar.connectionState = "connecting";
          eq("C7 label de connecting", etiqueta(), "Conectando…");
          check("C8 connecting deshabilita el botón", connect.disabled === true);

          navbar.account = "0x7a3f111122223333444455556666777788889c2e";
          navbar.connectionState = "connected";
          eq("C9 label de connected", etiqueta(), "Conectado");
          check("C10 el chip de la dirección se muestra", navAccount.hidden === false);
          eq("C11 dirección acortada", NORM(navAccount.textContent), "0x7a3f...9c2e");
          check("C12 sin title cuando no hace falta", !connect.hasAttribute("title"));

          // ── C13-C19. Desconectar ──────────────────────────────────
          const desconectar = navRoot.querySelector("#disconnectButton");
          const tarjeta = doc.querySelector("whiskito-share-card");
          check("C13 conectado: aparece el botón de desconectar",
            Boolean(desconectar) && desconectar.hidden === false, `hidden=${desconectar?.hidden}`);

          let conexionesPedidas = 0;
          doc.addEventListener("whiskito:connect-request", () => conexionesPedidas++, true);
          connect.click();
          await sleep(150);
          check("C14 conectado: el botón de conectar no vuelve a pedir conexión",
            conexionesPedidas === 0, `eventos=${conexionesPedidas}`);

          // Se deja la isla de compartir activa y abierta, como quedaría tras
          // conectar de verdad, para comprobar que desconectar deshace TODO.
          tarjeta.address = "0x7a3f111122223333444455556666777788889c2e";
          tarjeta.open = true;
          await sleep(400);

          let desconexiones = 0;
          doc.addEventListener("whiskito:disconnect-request", () => desconexiones++, true);
          desconectar.click();
          await sleep(600);
          check("C15 desconectar emite su evento", desconexiones === 1, `eventos=${desconexiones}`);
          check("C16 main.js deshace el estado de conexión",
            navbar.connectionState === "disconnected" && navbar.account === "",
            `state=${navbar.connectionState} account="${navbar.account}"`);
          check("C17 al desconectar, la tarjeta de compartir se bloquea y se cierra",
            tarjeta.address === "" && tarjeta.open === false,
            `address="${tarjeta.address}" open=${tarjeta.open}`);
          check("C18 al desconectar, el panel vuelve al preview",
            panel.donations.length === 3 && panelRoot.querySelectorAll("#donationsList .r-item").length === 3,
            `donations=${panel.donations.length} filas=${panelRoot.querySelectorAll("#donationsList .r-item").length}`);
          check("C19 desconectado: el botón de desconectar se esconde",
            desconectar.hidden === true, `hidden=${desconectar.hidden}`);

          // ── D. Isla del panel ─────────────────────────────────────
          const guardadas = panel.donations;
          panel.donations = [];
          eq("D1 sin donaciones no hay filas", rows().length, 0);
          check("D2 estado vacío visible", empty.hidden === false);
          panel.donations = guardadas;
          eq("D3 vuelven las filas", rows().length, 3);
          check("D4 estado vacío oculto", empty.hidden === true);

              panel.withdrawMessage !== "¡Retirado!",
            `firmas ${firmasAntes}→${firmasDeRetiro()} status=${panel.withdrawStatus} msg="${panel.withdrawMessage}"`);
          // (b) El caso que importa: el panel todavía muestra un saldo (UI sin
          //     refrescar) pero la chain no tiene nada para msg.sender. Ahora el
          //     click SÍ recorre el camino de escritura (simular → firmar →
          //     confirmar) y el contrato revierte.
          panel.balanceEth = "0.01";
          await sleep(200);
          check("A4-3 con el panel mostrando saldo el botón vuelve a estar clickeable",
            withdrawButton.disabled === false, `disabled=${withdrawButton.disabled}`);
          withdrawButton.click();
          await sleep(2500);
          check("A4-4 el segundo retiro NO reporta éxito", panel.withdrawStatus !== "success",
            `status=${panel.withdrawStatus} msg="${panel.withdrawMessage}"`);
          check("A4-5 y queda en 'error', sin el mensaje '¡Retirado!'",
            panel.withdrawStatus === "error" && panel.withdrawMessage !== "¡Retirado!",
            `status=${panel.withdrawStatus} msg="${panel.withdrawMessage}"`);
          const saldoTrasSegundo = await saldoOnChain(DUEÑO);
          check("A4-6 el intento revirtió en la simulación: no hubo firma nueva ni se movió el saldo",
            firmasDeRetiro() === firmasAntes && saldoTrasSegundo === "0",
            `firmas ${firmasAntes}→${firmasDeRetiro()} chain=${saldoTrasSegundo}`);
          panel.balanceEth = "0"; // el panel vuelve al estado que dejó el retiro real
          await sleep(200);

          // ── W. RETIRO PARCIAL (panel del backstage) ───────────────────
          // El retiro parcial es un camino nuevo: el evento
          // `whiskito:withdraw-request` viaja con `detail.amount`, y con un
          // string decimal en ETH tiene que terminar en `withdraw(uint256)`
          // (selector 0x2e1a7d4d) con el monto en wei. Nada de esto lo ejercía
          // el harness: sólo había retiro TOTAL.
          //
          // La isla es UI, no autoridad: valida ANTES de pedir la firma. Y el
          // oráculo sigue siendo la chain (`balances`), no lo que la UI dice.

          // Los dos helpers que faltaban: el monto en wei como texto decimal
          // (independiente del `formatEther` de la app) y el techo de la firma.
          const weiAeth = (wei) => {
            const entero = wei / 10n ** 18n;
            const dec = (wei % 10n ** 18n).toString().padStart(18, "0").replace(/0+$/, "");
            return dec ? `${entero}.${dec}` : `${entero}`;
          };
          const paramDe = (data) => (data && data.length >= 10 ? BigInt("0x" + data.slice(10, 74)) : null);
          // El monto en wei, EXACTO: `Number(decimal) * 1e9 * 1e9` no da el wei
          // original (el decimal pasa por un flotante), así que un "un wei más"
          // construido así puede terminar siendo un wei MENOS y la validación
          // —correctamente— lo aceptaría. Se parte el texto en entero y
          // decimales y se arma el BigInt a mano.
          const weiDeEth = (texto) => {
            const [entero, decimales = ""] = String(texto).trim().split(".");
            const frac = (decimales + "0".repeat(18)).slice(0, 18);
            return BigInt(entero || "0") * 10n ** 18n + BigInt(frac || "0");
          };
          const firmasDe = (selector) => pedidos.filter(
            (p) => p.method === "eth_sendTransaction" && p.params?.[0]?.to?.toLowerCase() === CONTRATO.toLowerCase() &&
              String(p.params?.[0]?.data ?? "").startsWith(selector),
          );
          // `elementFromPoint` sobre el shadow root: devuelve lo que hay ARRIBA
          // de verdad. Un `elemento.click()` programático pasa igual con el botón
          // tapado, así que no prueba que una persona pueda clickearlo.
          const alcanzableEn = (root, el) => {
            if (!el || el.getClientRects().length === 0) return false;
            const r = el.getBoundingClientRect();
            const arriba = root.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2);
            return arriba === el || el.contains(arriba);
          };
          const centroDe = (el) => {
            if (!el) return "sin caja";
            const r = el.getBoundingClientRect();
            return `[${[r.left, r.top, r.width, r.height].map(Math.round).join(",")}]`;
          };
          // Escribe en el input como lo haría una persona. Devuelve lo que el
          // navegador dejó adentro: un `type=number` puede RECHAZAR el texto
          // (`"0,5"`) y eso también es un veredicto de la UI.
          const escribirMonto = async (inputEl, texto) => {
            typeInto(inputEl, texto);
            await sleep(120);
            return inputEl.value;
          };

          const panelWithdrawButton = panelRoot.querySelector("#withdrawButton");
          const panelPartButton = panelRoot.querySelector("#withdrawPartButton");
          const panelPartRow = panelRoot.querySelector("#withdrawPart");
          const panelAmount = panelRoot.querySelector("#withdrawAmount");
          const panelPartError = panelRoot.querySelector("#withdrawPartError");
          const panelConfirm = panelRoot.querySelector("#withdrawConfirmButton");
          const panelCancel = panelRoot.querySelector("#withdrawCancelButton");
          const panelWithdrawStatus = panelRoot.querySelector("#withdrawStatus");

          // La OTRA isla que retira: la tabla del historial de la vista del
          // profesional. El veredicto es uno solo y se escribe en las dos
          // (islands.setWithdrawStatus), así que su espejo se lee de acá. El
          // bloque V, más abajo, ejerce el retiro desde ESTA isla.
          // OJO: la isla se DESMONTA al desconectar y se vuelve a montar al
          // reconectar (hideProfesional / showProfesional), así que toda lectura
          // de acá en adelante tiene que salir de una consulta NUEVA: un nodo
          // guardado antes de una reconexión queda desconectado del documento y
          // su balance se congela.
          const tablaViva = () => doc.querySelector("whiskito-history-table");

          check("W1 el panel tiene las dos vías de retiro y la fila nace colapsada",
            Boolean(panelWithdrawButton && panelPartButton && panelPartRow && panelAmount && panelPartError && panelConfirm && panelCancel && panelWithdrawStatus) &&
              panelPartRow.hidden === true,
            `nodos=${[panelWithdrawButton, panelPartButton, panelPartRow, panelAmount, panelPartError, panelConfirm, panelCancel, panelWithdrawStatus].filter(Boolean).length}/8 filaHidden=${panelPartRow?.hidden}`);

          // ── Estado del test: hay plata que retirar ────────────────────
          // H1 y A4 dejaron el saldo del dueño en CERO. El retiro parcial sin
          // saldo no se puede ejercitar, así que el test se prepara el suyo:
          // una donación real más (la firma el nodo, no la wallet falsa).
          const fund2 = await fetch("http://127.0.0.1:8545", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              jsonrpc: "2.0", id: 1, method: "eth_sendTransaction",
              params: [{
                from: DONANTE_ANVIL, to: CONTRATO,
                value: "0x" + (3000000000000000n).toString(16), // 0.003 ETH
                data: "0x23024408" + DUEÑO.slice(2).padStart(64, "0"), // fund(DUEÑO)
              }],
            }),
          }).then((r) => r.json());
          check("W2 el test se preparó su propio saldo (donación real, control de esta prueba)",
            String(fund2.result ?? "").startsWith("0x"), JSON.stringify(fund2).slice(0, 160));
          await sleep(700);
          const saldoAntes = await saldoOnChain(DUEÑO);

          // El panel se relee de la chain como en una conexión (la isla no lee
          // nada por su cuenta: recibe los datos por propiedades).
          await cargarPanel(DUEÑO);
          await sleep(300);
          check("W3 con saldo real, el botón de retirar todo queda habilitado",
            panelWithdrawButton.hidden === false && panelWithdrawButton.disabled === false &&
              panel.balanceEth === saldoAntes && panel.balanceEth !== "0",
            `chain=${saldoAntes} panel=${panel.balanceEth} hidden=${panelWithdrawButton.hidden} disabled=${panelWithdrawButton.disabled}`);

          // 1. Las dos vías existen, son VISIBLES y alcanzables con el mouse.
          //    El recibo está rotado 1.2deg: el hit test es la única prueba de
          //    que un elemento no quedó tapado por el orden de pintado.
          //
          // ── Precondición de W4 y W8: el panel en la vista del VISITANTE ──
          // W4 y W8 son las dos únicas aserciones del bloque W que miden
          // GEOMETRÍA (`alcanzableEn` = getBoundingClientRect + elementFromPoint),
          // y el panel ya no se muestra en la vista del profesional —su retiro
          // vive en la tabla del historial—: con `is-profesional`
          // puesto su caja es 0x0 y las dos medirían el estado escondido en vez
          // del retiro. El panel sigue siendo el mismo recinto de siempre, y la
          // vista donde vive es la del VISITANTE: es el mismo criterio con el que
          // L4 y M2/M6 recuperan su precondición (ver "Precondición de L y M").
          // Se saca SÓLO la clase del body —la vista—; la cuenta sigue conectada
          // como dueño, que es lo que W necesita para firmar el retiro.
          // Y se RESTITUYE apenas termina W8: P8 mide la transición al
          // desconectar (que la clase se vaya), y con la clase ya sacada de antes
          // pasaría sin haber medido nada.
          doc.body.classList.remove("is-profesional");
          panelWithdrawButton.scrollIntoView({ block: "center", behavior: "instant" });
          await sleep(250);
          check("W4 «Retirar todo» y «Retirar una parte» son alcanzables y visibles (no tapados)",
            alcanzableEn(panelRoot, panelWithdrawButton) && alcanzableEn(panelRoot, panelPartButton) &&
              panelWithdrawButton.hidden === false && panelPartButton.hidden === false,
            `todo=${alcanzableEn(panelRoot, panelWithdrawButton)}${centroDe(panelWithdrawButton)} parte=${alcanzableEn(panelRoot, panelPartButton)}${centroDe(panelPartButton)} scrollY=${Math.round(win.scrollY)} ventana=${win.innerWidth}x${win.innerHeight}`);

          // 2. «Retirar una parte» despliega la fila. El input nace VACÍO (el
          //    monto lo escribe la persona) y su placeholder es el saldo.
          panelPartButton.click();
          await sleep(200);
          check("W5 el click despliega la fila, esconde el botón que la abre y no firma nada",
            panelPartRow.hidden === false && panelPartButton.hidden === true &&
              firmasDe("0x2e1a7d4d").length === 0,
            `filaHidden=${panelPartRow.hidden} botonHidden=${panelPartButton.hidden} filas=${firmasDe("0x2e1a7d4d").length}`);
          check("W6 el input arranca vacío y con el saldo disponible de placeholder",
            panelAmount.value === "" && panelAmount.placeholder === saldoAntes,
            `value="${panelAmount.value}" placeholder="${panelAmount.placeholder}" saldo=${saldoAntes}`);
          check("W7 vacío es inválido: el confirmar arranca deshabilitado",
            panelConfirm.disabled === true &&
              NORM(panelPartError.textContent) === "El monto tiene que ser mayor que 0" &&
              panelPartError.hidden === false,
            `disabled=${panelConfirm.disabled} error="${NORM(panelPartError.textContent)}" errorHidden=${panelPartError.hidden}`);
          check("W8 el input, el confirmar y el cancelar son alcanzables de verdad",
            alcanzableEn(panelRoot, panelAmount) && alcanzableEn(panelRoot, panelConfirm) && alcanzableEn(panelRoot, panelCancel),
            `input=${alcanzableEn(panelRoot, panelAmount)}${centroDe(panelAmount)} confirmar=${alcanzableEn(panelRoot, panelConfirm)}${centroDe(panelConfirm)} cancelar=${alcanzableEn(panelRoot, panelCancel)}${centroDe(panelCancel)}`);
          // W8 cerró las dos mediciones de geometría del panel: se RESTITUYE la
          // clase del body (la vista que el flujo tenía puesta) para que P8 siga
          // midiendo la transición real al desconectar y nada de acá en adelante
          // vea una vista que la app no pidió.
          doc.body.classList.add("is-profesional");

          // 3. Fronteras de la validación.
          await escribirMonto(panelAmount, "0");
          check("W9 el monto 0 queda deshabilitado (no es un retiro)",
            panelConfirm.disabled === true &&
              NORM(panelPartError.textContent) === "El monto tiene que ser mayor que 0",
            `disabled=${panelConfirm.disabled} error="${NORM(panelPartError.textContent)}"`);

          // Más que el saldo: se cae el entero y también un pelo por encima.
          const demasiado = weiAeth((BigInt(Math.round(Number(saldoAntes) * 1e9)) + 1n) * 10n ** 9n);
          await escribirMonto(panelAmount, demasiado);
          check("W10 más que el saldo queda deshabilitado y lo dice",
            panelConfirm.disabled === true &&
              NORM(panelPartError.textContent) === "No podés retirar más de lo que tenés" &&
              panelPartError.hidden === false,
            `monto=${demasiado} disabled=${panelConfirm.disabled} error="${NORM(panelPartError.textContent)}"`);

          // Exactamente el saldo: es válido (el borde bueno).
          await escribirMonto(panelAmount, saldoAntes);
          check("W11 un monto igual al saldo habilita el confirmar y se lo quita de encima",
            panelConfirm.disabled === false && panelPartError.hidden === true,
            `monto=${saldoAntes} disabled=${panelConfirm.disabled} errorHidden=${panelPartError.hidden} error="${NORM(panelPartError.textContent)}"`);

          // Textos que NO son un decimal limpio: ninguno puede terminar en un
          // "éxito falso". El type=number puede rechazarlos (queda vacío) y la
          // isla puede rechazarlos (queda inválido): lo que no puede pasar es
          // que la app firme y reporte éxito con un monto que no es el escrito.
          const MONTO = "0.001";
          const MONTO_WEI = 1000000000000000n; // 0.001 ETH
          const firmasRaras = firmasDe("0x2e1a7d4d").length;
          const raros = [];
          for (const texto of ["1e3", "0,5", "abc"]) {
            panel.withdrawStatus = "idle";
            panel.withdrawMessage = "";
            const quedó = await escribirMonto(panelAmount, texto);
            if (!panelConfirm.disabled) panelConfirm.click();
            await sleep(250);
            raros.push(`${texto}→"${quedó}"`);
            // El navegador puede RECHAZAR el texto (queda vacío) o la isla puede
            // rechazarlo (queda inválido): en los dos casos el confirmar tiene
            // que estar apagado, no puede haber firma nueva, y el veredicto no
            // puede haber quedado en "éxito".
            check(`W12-«${texto}» un monto que no es un decimal limpio no termina en éxito`,
              panelConfirm.disabled === true &&
                /El monto tiene que ser mayor que 0|No podés retirar más de lo que tenés/.test(NORM(panelPartError.textContent)) &&
                firmasDe("0x2e1a7d4d").length === firmasRaras &&
                panel.withdrawStatus !== "success",
              `escribí «${texto}» y quedó "«${quedó}»" disabled=${panelConfirm.disabled} error="${NORM(panelPartError.textContent)}" status=${panel.withdrawStatus} msg="${panel.withdrawMessage}" firmas=${firmasRaras}→${firmasDe("0x2e1a7d4d").length}`);
          }
          check("W12b ninguno de los montos raros dejó firma ni veredicto de éxito",
            firmasDe("0x2e1a7d4d").length === firmasRaras && panel.withdrawStatus !== "success",
            `casos=${raros.join(" ")} · firmas=${firmasRaras}→${firmasDe("0x2e1a7d4d").length} status=${panel.withdrawStatus}`);

          // 4. Monto válido → UNA sola firma, con el selector de `withdraw` y el
          //    monto en wei en los 32 bytes del argumento (no alcanza con mirar
          //    el selector).
          await escribirMonto(panelAmount, MONTO);
          check("W13 con un monto válido el confirmar queda habilitado",
            panelConfirm.disabled === false && panelPartError.hidden === true,
            `disabled=${panelConfirm.disabled} error="${NORM(panelPartError.textContent)}"`);
          const saldoAntesParcial = await saldoOnChain(DUEÑO);
          const firmasParcialAntes = firmasDe("0x2e1a7d4d").length;
          const firmasTotalesAntes = firmasDe("0x853828b6").length;
          panelConfirm.click();
          await sleep(3500); // firma + recibo real de anvil
          const firmasParcial = firmasDe("0x2e1a7d4d");
          const firma = firmasParcial[firmasParcial.length - 1];
          const dataParcial = String(firma?.params?.[0]?.data ?? "");
          check("W14 el retiro parcial firma UNA sola vez y contra el contrato",
            firmasParcial.length === firmasParcialAntes + 1 &&
              firma?.params?.[0]?.to?.toLowerCase() === CONTRATO.toLowerCase(),
            `firmas ${firmasParcialAntes}→${firmasParcial.length} to=${firma?.params?.[0]?.to}`);
          check("W15 y llama a withdraw(uint256), no a withdrawAll()",
            dataParcial.startsWith("0x2e1a7d4d") && firmasDe("0x853828b6").length === firmasTotalesAntes,
            `data=${dataParcial.slice(0, 74)} withdrawAll=${firmasTotalesAntes}→${firmasDe("0x853828b6").length}`);
          check("W16 con el monto correcto en wei en el argumento (0.001 ETH = 1000000000000000 wei)",
            paramDe(dataParcial) === MONTO_WEI,
            `arg=${paramDe(dataParcial)} esperado=${MONTO_WEI} data=${dataParcial.slice(0, 74)}`);
          check("W17 a withdraw no se le pasa ninguna dirección (el contrato usa balances[msg.sender])",
            dataParcial.length === 74 && !dataParcial.toLowerCase().includes(DUEÑO.slice(2).toLowerCase()),
            `len=${dataParcial.length} from=${firma?.params?.[0]?.from} data=${dataParcial}`);

          // 5. El efecto on-chain es EXACTO: baja ese monto, ni más ni menos.
          const saldoDespues = await saldoOnChain(DUEÑO);
          const esperadoDespues = weiAeth(BigInt(Math.round(Number(saldoAntesParcial) * 1e9)) * 10n ** 9n - MONTO_WEI);
          check("W18 el saldo de la chain bajó EXACTAMENTE el monto retirado",
            saldoDespues === esperadoDespues && saldoDespues !== saldoAntesParcial,
            `chain ${saldoAntesParcial}→${saldoDespues} esperado=${esperadoDespues}`);
          check("W19 y el resto sigue disponible (no se vació la cuenta)",
            Number(saldoDespues) > 0,
            `chain=${saldoDespues}`);
          check("W20 la UI del panel muestra el saldo nuevo, leído de la chain",
            panel.balanceEth === saldoDespues,
            `panel=${panel.balanceEth} chain=${saldoDespues}`);

          // 7. El veredicto queda VISIBLE en la isla que lo disparó.
          check("W21 el veredicto «¡Retirado!» queda visible en el panel",
            panel.withdrawStatus === "success" && panel.withdrawMessage === "¡Retirado!" &&
              panelWithdrawStatus.hidden === false &&
              NORM(panelWithdrawStatus.textContent) === "¡Retirado!" &&
              panelWithdrawStatus.classList.contains("is-success"),
            `status=${panel.withdrawStatus} msg="${panel.withdrawMessage}" hidden=${panelWithdrawStatus.hidden} texto="${NORM(panelWithdrawStatus.textContent)}" clases=${panelWithdrawStatus.className}`);
          check("W21b el mismo veredicto se escribió en la otra isla que retira (una sola verdad para dos islas)",
            tablaViva().withdrawStatus === "success" && tablaViva().withdrawMessage === "¡Retirado!",
            `tabla=${tablaViva().withdrawStatus} msg="${tablaViva().withdrawMessage}"`);

          // 6. Cancelar: colapsa la fila, limpia el input y no firma nada.
          panelPartButton.click();
          await sleep(200);
          await escribirMonto(panelAmount, MONTO);
          const firmasAntesCancelar = firmasDe("0x2e1a7d4d").length;
          panelCancel.click();
          await sleep(250);
          check("W22 cancelar colapsa la fila, limpia el input y no firma nada",
            panelPartRow.hidden === true && panelAmount.value === "" && panelPartButton.hidden === false &&
              firmasDe("0x2e1a7d4d").length === firmasAntesCancelar &&
              (await saldoOnChain(DUEÑO)) === saldoDespues,
            `filaHidden=${panelPartRow.hidden} input="${panelAmount.value}" botonHidden=${panelPartButton.hidden} firmas=${firmasAntesCancelar}→${firmasDe("0x2e1a7d4d").length} chain=${await saldoOnChain(DUEÑO)}`);

          // ── V. EL RETIRO DESDE LA TABLA DEL HISTORIAL ─────────────────
          // El retiro del profesional ya no vive en un modal: vive en la MISMA
          // tabla del historial que la vista monta inline, con el permiso
          // `canWithdraw` que el flujo le pasa al encenderla (app.js →
          // islands.showHistory). Es opt-in: sin el permiso la isla no dibuja ni
          // el saldo ni los botones, así que `/historial` sigue siendo una página
          // de lectura. V7 es el control negativo de ese opt-in.
          //
          // Los eventos son los de SIEMPRE —`whiskito:withdraw-request` con
          // `amount: null` para el total y con el texto decimal en POL para el
          // parcial—, así que el oráculo vuelve a ser la chain: `balances(address)`
          // leído por el harness, no lo que la UI dice.
          let tablaRootV = doc.querySelector("whiskito-history-table").shadowRoot;
          let tablaBotonTodo = tablaRootV.querySelector("#histWithdrawButton");
          let tablaBotonParte = tablaRootV.querySelector("#histWithdrawPartButton");
          let tablaFilaParte = tablaRootV.querySelector("#histWithdrawPart");
          let tablaMonto = tablaRootV.querySelector("#histWithdrawAmount");
          let tablaError = tablaRootV.querySelector("#histWithdrawPartError");
          let tablaConfirm = tablaRootV.querySelector("#histWithdrawConfirmButton");
          let tablaCancel = tablaRootV.querySelector("#histWithdrawCancelButton");
          let tablaStatus = tablaRootV.querySelector("#histWithdrawStatus");
          let tablaBalancePintado = tablaRootV.querySelector("#histBalance");

          // V1. Sin permiso, nada: es el punto de partida y el control negativo
          //     del opt-in. El discriminador es el `hidden` de la sección —el
          //     texto de los botones sigue en el DOM aunque la sección no se
          //     dibuje, así que mirar el texto no probaría nada—.
          tablaViva().canWithdraw = false;
          await sleep(250);
          check("V1 sin canWithdraw la tabla NO ofrece retirar (el opt-in, apagado)",
            tablaViva().canWithdraw === false &&
              tablaRootV.querySelector(".hist-withdraw").hidden === true,
            `canWithdraw=${tablaViva().canWithdraw} seccionHidden=${tablaRootV.querySelector(".hist-withdraw").hidden}`);
          tablaViva().canWithdraw = true;
          await sleep(250);

          // V2. Con permiso, el saldo que muestra es el de la CHAIN.
          let saldoV = await saldoOnChain(DUEÑO);
          // El fondo de la vista: la PÁGINA es negra y el lienzo del viewport
          // también (si no, el blanco del navegador asomaría donde el documento
          // no llega, y el pedido es UN solo color de fondo).
          check("V1b el fondo de la vista del profesional es negro, también en el lienzo del viewport",
            win.getComputedStyle(doc.body).backgroundColor === "rgb(28, 21, 18)" &&
              win.getComputedStyle(doc.documentElement).backgroundColor === "rgb(28, 21, 18)",
            `body=${win.getComputedStyle(doc.body).backgroundColor} html=${win.getComputedStyle(doc.documentElement).backgroundColor} (--ink = #1c1512)`);

          check("V2 autorizada, la tabla muestra el saldo disponible de la chain (con los dos botones)",
            tablaViva().canWithdraw === true && tablaViva().balanceEth === saldoV && Number(saldoV) > 0 &&
              tablaRootV.querySelector(".hist-withdraw").hidden === false &&
              tablaBotonTodo.hidden === false && tablaBotonParte.hidden === false &&
              /^\d+(\.\d+)?$/.test(NORM(tablaBalancePintado.textContent)) &&
              NORM(tablaBalancePintado.textContent) === saldoV &&
              /^≈ \$[\d.]+ USD$/.test(NORM(tablaRootV.querySelector("#histBalanceUsd").textContent)),
            `chain=${saldoV} tabla=${tablaViva().balanceEth} pintado="${NORM(tablaBalancePintado.textContent)}" usd="${NORM(tablaRootV.querySelector("#histBalanceUsd")?.textContent)}" hidden=${tablaBotonTodo.hidden}/${tablaBotonParte.hidden}`);

          // V3. Los botones son alcanzables DE VERDAD. La tabla está al final de
          //     una página larga: se scrollea a la tarjeta y se comprueba con
          //     `elementFromPoint` (`.click()` programático pasa aunque el botón
          //     esté tapado).
          tablaBotonTodo.scrollIntoView({ block: "center", behavior: "instant" });
          await sleep(250);
          check("V3 los dos botones de la tabla son alcanzables y visibles (no tapados)",
            alcanzableEn(tablaRootV, tablaBotonTodo) && alcanzableEn(tablaRootV, tablaBotonParte) &&
              tablaBotonTodo.disabled === false && tablaBotonParte.disabled === false,

          const firmasV = () => firmasDe("0x853828b6").length;

          // V4. "Retirar todo" firma withdrawAll() y la chain queda en cero.

          tablaBotonTodo.click();
          await sleep(3500);
          const saldoTrasTodo = await saldoOnChain(DUEÑO);
          check("V4 «Retirar todo» firma UNA vez withdrawAll() contra el contrato",

          const fundV = await fetch("http://127.0.0.1:8545", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              jsonrpc: "2.0", id: 1, method: "eth_sendTransaction",

              }],

          }).then((r) => r.json());
          check("V6 el test se preparó saldo para el retiro parcial (donación real, control de esta prueba)",

          await sleep(700);
          navRoot.querySelector("#disconnectButton").click();
          await sleep(700);
          navRoot.querySelector("#connectButton").click();
          await sleep(1800);
          // Reconectar reabre el panel de compartir (showConnectedAccount lo abre

          share.open = false;
          await sleep(150);
          // Y la tabla es un nodo NUEVO: la isla se desmontó al desconectar y
          // showProfesional la volvió a crear. Se vuelven a resolver los nodos
          // sobre ESA isla viva (los de arriba quedaron desconectados).
          const tablaV = tablaViva();
          tablaRootV = tablaV.shadowRoot;

          tablaBotonTodo = tablaRootV.querySelector("#histWithdrawButton");
          tablaBotonParte = tablaRootV.querySelector("#histWithdrawPartButton");
          tablaFilaParte = tablaRootV.querySelector("#histWithdrawPart");
          tablaMonto = tablaRootV.querySelector("#histWithdrawAmount");
          tablaError = tablaRootV.querySelector("#histWithdrawPartError");
          tablaConfirm = tablaRootV.querySelector("#histWithdrawConfirmButton");
          tablaCancel = tablaRootV.querySelector("#histWithdrawCancelButton");
          tablaStatus = tablaRootV.querySelector("#histWithdrawStatus");
          saldoV = await saldoOnChain(DUEÑO);
          check("V7 tras preparar saldo, la tabla lo muestra (la lectura nueva y el permiso siguen vivos)",
            tablaV.canWithdraw === true && tablaV.balanceEth === saldoV && Number(saldoV) > 0 &&
              NORM(tablaBalancePintado.textContent) === saldoV &&
              /^≈ \$[\d.]+ USD$/.test(NORM(tablaRootV.querySelector("#histBalanceUsd").textContent)),
            `chain=${saldoV} tabla=${tablaV.balanceEth} pintado="${NORM(tablaBalancePintado.textContent)}" canWithdraw=${tablaV.canWithdraw}`);

          // V8. "Retirar una parte" despliega la fila con el input vacío y el
          //     placeholder en el saldo disponible.
          tablaBotonParte.scrollIntoView({ block: "center", behavior: "instant" });
          await sleep(250);
          tablaBotonParte.click();
          await sleep(200);
          check("V8 el click despliega la fila con el input vacío y el confirmar apagado",

          // La fila abierta es más alta que los dos botones de arriba: se
          // scrollea a su centro para que el confirmar y el cancelar caigan
          // DENTRO de la ventana (si no, `elementFromPoint` devuelve el borde y

          tablaConfirm.scrollIntoView({ block: "center", behavior: "instant" });
          await sleep(250);
          check("V9 el input, el confirmar y el cancelar de la tabla son alcanzables de verdad",
            alcanzableEn(tablaRootV, tablaMonto) && alcanzableEn(tablaRootV, tablaConfirm) && alcanzableEn(tablaRootV, tablaCancel),
            (() => {

            })());

          // V10. Las fronteras del monto: vacío y 0 inválidos, más que el saldo
          //      inválido (y lo dice), exactamente el saldo VÁLIDO. Y al final un
          //      monto REAL (0.001) que no vacía la cuenta.

          check("V11 un monto igual al saldo es válido y habilita el confirmar (el borde bueno)",

          // V12. El retiro parcial firma withdraw(uint256) con el monto en wei, el

          //      el saldo nuevo (lo relee el flujo después del retiro, que es lo
          //      que antes hacía con el modal).
          const saldoAntesParcialV = await saldoOnChain(DUEÑO);
          const firmasParcialAntesV = firmasParcialV();
          const firmasTodoAntesV = firmasV();
          tablaConfirm.click();
          await sleep(3500);
          const dataParcialV = String(firmasDe("0x2e1a7d4d").at(-1)?.params?.[0]?.data ?? "");
          const saldoDespuesParcialV = await saldoOnChain(DUEÑO);
          const esperadoParcialV = weiAeth(weiDeEth(saldoAntesParcialV) - MONTO_WEI);
          check("V12 el retiro parcial firma UNA vez withdraw(uint256) con el monto en wei (y no withdrawAll)",
            firmasParcialV() === firmasParcialAntesV + 1 && dataParcialV.startsWith("0x2e1a7d4d") &&
              paramDe(dataParcialV) === MONTO_WEI && firmasV() === firmasTodoAntesV,
            `firmas ${firmasParcialAntesV}→${firmasParcialV()} arg=${paramDe(dataParcialV)} withdrawAll=${firmasTodoAntesV}→${firmasV()}`);
          check("V13 a withdraw no se le pasa ninguna dirección (el contrato usa balances[msg.sender])",
            dataParcialV.length === 74 && !dataParcialV.toLowerCase().includes(DUEÑO.slice(2).toLowerCase()),
            `len=${dataParcialV.length} data=${dataParcialV}`);
          check("V14 el saldo de la chain bajó EXACTAMENTE el monto retirado desde la tabla",
            saldoDespuesParcialV === esperadoParcialV && saldoDespuesParcialV !== saldoAntesParcialV,
            `chain ${saldoAntesParcialV}→${saldoDespuesParcialV} esperado=${esperadoParcialV}`);
          check("V15 y el resto sigue disponible (no se vació la cuenta)",
            Number(saldoDespuesParcialV) > 0, `chain=${saldoDespuesParcialV}`);
          check("V16 la tabla quedó con el saldo fresco de la chain, no con el de antes",
            tablaViva().balanceEth === saldoDespuesParcialV && tablaViva().balanceEth !== saldoAntesParcialV &&
              NORM(tablaBalancePintado.textContent) === saldoDespuesParcialV,
            `tabla=${tablaViva().balanceEth} pintado="${NORM(tablaBalancePintado.textContent)}" chain=${saldoDespuesParcialV} (antes ${saldoAntesParcialV})`);

          // V17. El veredicto queda VISIBLE en la isla que lo disparó, y el mismo
          //      texto llegó a la otra isla que retira (una sola verdad).
          check("V17 el veredicto «¡Retirado!» queda visible en la tabla",
            tablaViva().withdrawStatus === "success" && tablaViva().withdrawMessage === "¡Retirado!" &&
              tablaStatus.hidden === false && NORM(tablaStatus.textContent) === "¡Retirado!" &&
              tablaStatus.classList.contains("is-success"),
            `status=${tablaViva().withdrawStatus} msg="${tablaViva().withdrawMessage}" hidden=${tablaStatus.hidden} texto="${NORM(tablaStatus.textContent)}" clases=${tablaStatus.className}`);
          check("V18 y el mismo veredicto se escribió en la otra isla que retira (una sola verdad para dos islas)",
            panel.withdrawStatus === "success" && panel.withdrawMessage === "¡Retirado!" &&
              NORM(panelWithdrawStatus.textContent) === "¡Retirado!",
            `panel=${panel.withdrawStatus} "${NORM(panelWithdrawStatus.textContent)}"`);

          // V19. Cancelar: colapsa la fila, limpia el input y no firma nada.
          tablaBotonParte.click();
          await sleep(200);
          await escribirMonto(tablaMonto, MONTO_V);
          const firmasAntesCancelarV = firmasParcialV();
          tablaCancel.click();
          await sleep(250);
          check("V19 cancelar colapsa la fila, limpia el input y no firma nada",
            tablaFilaParte.hidden === true && tablaMonto.value === "" && tablaBotonParte.hidden === false &&
              firmasParcialV() === firmasAntesCancelarV &&
              (await saldoOnChain(DUEÑO)) === saldoDespuesParcialV,
            `filaHidden=${tablaFilaParte.hidden} input="${tablaMonto.value}" botonHidden=${tablaBotonParte.hidden} firmas=${firmasAntesCancelarV}→${firmasParcialV()}`);

          // V20. El OPT-IN, otra vez, al final: apagado el permiso, la tabla deja
          //      de ofrecer el retiro (el control negativo tiene que valer también
          //      DESPUÉS de haber retirado, no sólo antes de empezar).
          tablaViva().canWithdraw = false;
          await sleep(250);
          check("V20 apagado el permiso, la tabla vuelve a ser una página de lectura",
            tablaRootV.querySelector(".hist-withdraw").hidden === true && tablaViva().canWithdraw === false,
            `seccionHidden=${tablaRootV.querySelector(".hist-withdraw").hidden} canWithdraw=${tablaViva().canWithdraw}`);
          tablaViva().canWithdraw = true;
          await sleep(250);

          // Y se le devuelve el saldo a la cuenta que el resto del harness sigue
          // midiendo: A4 necesita que el dueño TENGA algo con qué intentar el
          // segundo retiro (el que revierte).
          await fetch("http://127.0.0.1:8545", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              jsonrpc: "2.0", id: 1, method: "eth_sendTransaction",
              params: [{
                from: DONANTE_ANVIL, to: CONTRATO,
                value: "0x" + (3000000000000000n).toString(16), // 0.003 ETH
                data: "0x23024408" + DUEÑO.slice(2).padStart(64, "0"),
              }],
            }),
          }).then((r) => r.json());
          await sleep(700);
          panel.balanceEth = "0";
          await sleep(200);

          check("H1f el botón de cerrar lo cierra", sharePanel?.hidden === true, `hidden=${sharePanel?.hidden}`);

          shareTrigger.click();
          await sleep(600);
          check("H1g el trigger lo vuelve a abrir",
            sharePanel?.hidden === false && shareTrigger.getAttribute("aria-expanded") === "true",
            `hidden=${sharePanel?.hidden} expanded=${shareTrigger.getAttribute("aria-expanded")}`);
          const cajaPanelAbierto = sharePanel.getBoundingClientRect();

          // "flotando por toda la página siguiendo el scroll": el trigger está
          // anclado por abajo-izquierda y el panel por abajo (su alto puede
          // cambiar según el contenido, así que se compara el borde inferior).
          win.scrollTo({ top: 2000, behavior: "instant" });
          await sleep(300);
          const cajaTrigger1 = shareTrigger.getBoundingClientRect();
          const cajaPanel1 = sharePanel.getBoundingClientRect();
          const r = (n) => Math.round(n);
          check("H1e el widget sigue pegado al scrollear 2000px",
            Math.abs(cajaTrigger1.top - cajaTrigger0.top) <= 1 &&
              Math.abs(cajaPanel1.bottom - cajaPanelAbierto.bottom) <= 1 &&
              Math.abs(cajaPanel1.left - cajaPanelAbierto.left) <= 1,
            `trigger.top ${r(cajaTrigger0.top)}→${r(cajaTrigger1.top)} · panel.bottom ${r(cajaPanelAbierto.bottom)}→${r(cajaPanel1.bottom)} · panel.left ${r(cajaPanelAbierto.left)}→${r(cajaPanel1.left)} · panel.h ${r(cajaPanelAbierto.height)}→${r(cajaPanel1.height)}`);
          // El bug clásico de orden de pintado: un botón con posición absoluta
          // detrás de un hermano posicionado se ve invisible e inclickeable, y
          // `elemento.click()` programático igual funciona. elementFromPoint no
          // miente: devuelve lo que hay realmente arriba en ese punto.
          const cajaCierre = shareClose.getBoundingClientRect();
          const arriba = shareRoot.elementFromPoint(
            cajaCierre.left + cajaCierre.width / 2,

          check("H1g el × está por encima (un click de verdad lo alcanza)",
            Boolean(arriba && (arriba === shareClose || shareClose.contains(arriba))),
            `arriba=${arriba ? arriba.tagName.toLowerCase() + "." + arriba.className : "null"} (se esperaba #shareClose)`);

          check("H1f el panel no se sale de la ventana",
            cajaPanel1.height <= win.innerHeight - 130 + 1 && cajaPanel1.bottom <= win.innerHeight + 1,
            `alto=${r(cajaPanel1.height)} tope=${win.innerHeight - 130} bottom=${r(cajaPanel1.bottom)} ventana=${win.innerWidth}x${win.innerHeight}`);
          win.scrollTo({ top: 0, behavior: "instant" });
          await sleep(200);
          check("H2 como dueño: el link es el de su dirección", share.address !== "" && NORM(shareLink.textContent).includes(share.address),
            `address="${share.address}" link="${NORM(shareLink.textContent)}"`);
          check("H3 como dueño: se escondió el bloqueo", shareLocked?.hidden === true, `hidden=${shareLocked?.hidden}`);
          check("H4 como dueño: compartir habilitado", botonesRed.length >= 4 && botonesRed.every((b) => !b.disabled),
            `n=${botonesRed.length} disabled=${botonesRed.map((b) => b.disabled).join(",")}`);
          check("H5 el botón nativo sólo aparece si el navegador puede compartir",
            win.navigator.share ? Boolean(botonNativo && !botonNativo.hidden) : !botonNativo || botonNativo.hidden,
            `navigator.share=${typeof win.navigator.share} hidden=${botonNativo?.hidden}`);

          let conexionPedida = 0;
          doc.addEventListener("whiskito:connect-request", () => conexionPedida++, true);
          shareConnect.click();
          await sleep(200);
          check("H6 el CTA de la isla pide conectar", conexionPedida === 1, `eventos=${conexionPedida}`);

          share.address = DIRECCION;
          await sleep(1500); // import dinámico de la librería de QR
          const pixeles = qrCanvas ? qrCanvas.getContext("2d").getImageData(0, 0, qrCanvas.width, qrCanvas.height).data : [];
          check("H7 activa: se esconde el bloqueo", shareLocked?.hidden === true, `hidden=${shareLocked?.hidden}`);
          check("H8 activa: el link muestra la dirección", NORM(shareLink.textContent).replace(/\s+/g, "").includes(DIRECCION),
            NORM(shareLink.textContent));
          check("H9 activa: compartir habilitado", botonesRed.every((b) => !b.disabled), botonesRed.map((b) => b.disabled).join(","));
          check("H10 el QR se dibujó en el canvas", pixeles.length > 0 && pixeles.some((v, i) => i % 4 === 0 && v < 128),
            `canvas=${qrCanvas?.width}x${qrCanvas?.height} oscuros=${pixeles.filter((v, i) => i % 4 === 0 && v < 128).length}`);
          check("H11 el PNG del QR se sube para decodificar afuera", (await subirQr("qr-share")) === 200);

          const cajaQr = qrCanvas.getBoundingClientRect();
          const estiloQr = win.getComputedStyle(qrCanvas);
          const cajaTarjeta = shareRoot.querySelector(".share-card").getBoundingClientRect();
          check("H11c el QR queda entero dentro de la tarjeta (no lo recorta el overflow)",
            cajaQr.top >= cajaTarjeta.top - 1 && cajaQr.bottom <= cajaTarjeta.bottom + 1,
            `qr=${Math.round(cajaQr.top)}..${Math.round(cajaQr.bottom)} tarjeta=${Math.round(cajaTarjeta.top)}..${Math.round(cajaTarjeta.bottom)}`);
          check("H11b el QR en pantalla es cuadrado (no estirado)",
            Math.abs(cajaQr.width - cajaQr.height) <= 1,
            `caja=${Math.round(cajaQr.width)}x${Math.round(cajaQr.height)} attrs=${qrCanvas.width}x${qrCanvas.height} inline="${qrCanvas.getAttribute("style") || ""}" computed=${estiloQr.width}x${estiloQr.height}`);

          const abiertas = [];
          win.open = (url) => { abiertas.push(url); return null; };
          const compartidos = [];
          doc.addEventListener("whiskito:share", (e) => compartidos.push(e.detail), true);
          for (const red of ["whatsapp", "x", "telegram", "facebook"]) {
            shareRoot.querySelector(`[data-network="${red}"]`)?.click();
          }
          const codificada = encodeURIComponent(URL_ESPERADA);
          check("H12 whatsapp comparte la URL", abiertas[0]?.startsWith("https://wa.me/") && abiertas[0].includes(codificada), abiertas[0]);
          check("H13 x comparte la URL", Boolean(abiertas[1]?.includes(codificada)), abiertas[1]);
          check("H14 telegram comparte la URL", Boolean(abiertas[2]?.includes(codificada)), abiertas[2]);
          check("H15 facebook comparte la URL", Boolean(abiertas[3]?.includes(codificada)), abiertas[3]);
          check("H16 emite whiskito:share por cada red",
            ["whatsapp", "x", "telegram", "facebook"].every((n) => compartidos.some((d) => d.network === n)),
            compartidos.map((d) => d.network).join(","));
          check("H17 el detalle del evento trae la URL", compartidos.every((d) => d.url === URL_ESPERADA),
            compartidos.map((d) => d.url).slice(0, 2).join(" | "));

          copyButton.click();
          await sleep(500);
          check("H18 copiar link emite el evento y da feedback",
            compartidos.some((d) => d.network === "copy") && /copiad/i.test(copyButton.textContent),
            `texto="${NORM(copyButton.textContent)}" eventos=${compartidos.map((d) => d.network).join(",")}`);

          let portapapeles = "(no se pudo leer)";
          try {
            portapapeles = await win.navigator.clipboard.readText();
          } catch (e) {
            portapapeles = "error: " + ((e && e.name) || e);
          }
          check("H18b el link quedó en el portapapeles", portapapeles === URL_ESPERADA, portapapeles);

          downloadButton.click();
          await sleep(250);

            compartidos.map((d) => d.network).join(","));

            pngQr.startsWith("data:image/png;base64,") && pngQr.length > 2000, `len=${pngQr.length}`);

          share.address = "0x" + "A".repeat(40);
          await sleep(1500);
          check("H21 al cambiar la dirección el QR se regenera", (await subirQr("qr-share-2")) === 200);
          share.address = DIRECCION;
          await sleep(1200);

          // Geometría de referencia (para comparar antes/después de Shadow DOM)
          const geo = (el) => {
            if (!el) return "null";
            const r = el.getBoundingClientRect();
            return [Math.round(r.x), Math.round(r.y + win.scrollY), Math.round(r.width), Math.round(r.height)].join(",");
          };
          shareClose.click();
          await sleep(200);
          check("H22 el botón de cerrar cierra el panel", sharePanel?.hidden === true,
            `hidden=${sharePanel?.hidden} expanded=${shareTrigger.getAttribute("aria-expanded")}`);

          shareTrigger.click();
          await sleep(200);
          sharePanel.dispatchEvent(new win.KeyboardEvent("keydown", { key: "Escape", bubbles: true, composed: true }));
          await sleep(200);
          if (sharePanel?.hidden !== true) {
            // por si el listener está en el documento y no en el panel
            win.document.dispatchEvent(new win.KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
            await sleep(200);
          }
          check("H23 Escape cierra el panel", sharePanel?.hidden === true, `hidden=${sharePanel?.hidden}`);

          share.open = true;
          await sleep(250);
          check("H24 la propiedad open abre el panel (lo que usa main.js al conectar)",
            sharePanel?.hidden === false, `hidden=${sharePanel?.hidden}`);
          share.open = false;
          await sleep(150);

          // ── R. La página de OTRO: un donante ──────────────────────────
          // Es el caso que separa los dos roles: el dueño de la página es uno,

          // Una tercera página: la misma ruta `/u/0x…` pero SIN `demo=0`, o sea
          // lo que ve cualquier visitante. Acá pasa lo contrario que en R: con la
          // wallet conectada, donar NO firma nada y no deja ningún rastro local.
          //

          // de esa cuenta arranca vacía aunque el anvil de esta máquina venga con

          const FRESCO = "0x" + String(Date.now()).padStart(40, "0");
          const frame3 = document.createElement("iframe");
          frame3.style.cssText = "width:1440px;height:900px;border:0;position:absolute;left:-10000px";

          // El otro modo del navbar (el de una página aparte, con `base`) tiene

          // ── P10-P12. La ley §2.12: el link con dueño NO cambia de vista ─

          // El host de la tarjeta es `display: contents`, así que su display

          const escondeCard3 = (() => {
            for (let n = card3; n; n = n.parentElement ?? n.getRootNode()?.host ?? null) {
              if (win3.getComputedStyle(n).display === "none") return `${n.tagName ?? "?"}${n.id ? "#" + n.id : ""}`;
            }

          })();
          check("P11 la tarjeta de donación sigue visible (ningún ancestro la esconde)",

            `card=${win3.getComputedStyle(card3).display} lo esconde=${escondeCard3 || "nadie"}`);
          check("P12 las islas del profesional (saludo y tabla) NO están montadas en la página con dueño",
            doc3.querySelector("whiskito-pro-greeting") === null &&

          const input3 = cardRoot3.querySelector("#ehtAmount");
          input3.value = "0.002";

          await sleep(250);
          cardRoot3.querySelector("#fundButton").click();
          await sleep(2200);
          const firmas3 = pedidos3.filter((m) => /sign|sendTransaction|sendRawTransaction/i.test(m));
          check("N4 donar en modo demo NO pide ninguna firma (no se gasta gas)",
            firmas3.length === 0, `pedidos=${[...new Set(pedidos3)].join(",")}`);
          eq("N5 la tarjeta termina en success igual", card3.status, "success");
          check("N6 y el mensaje habla de demo, no de on-chain",
            /demo/i.test(NORM(cardRoot3.querySelector("#txText").textContent)) &&

          eq("N8 y el balance tampoco se movió", balanceResumen3(), balanceResumenAntes);
          check("N8b la demo no deja ningún rastro local",

          check("N30 en la página con dueño la tabla del historial no está montada (no hay retiro que ofrecer)",

          check("P13 tras desconectar en la página con dueño tampoco queda is-profesional",

            `class="${doc3.body.className}"`);

          // ── N18. En demo, el DUEÑO también puede probar la donación ───

          // (Que con donaciones REALES sí bloquee lo verifica el bloque R con
          // `?demo=0`, y la sonda de la página del link en su bloque P.)
          const frame4 = document.createElement("iframe");
          frame4.style.cssText = "width:1440px;height:900px;border:0;position:absolute;left:-10000px";
          frame4.src = `/src/index.html?cb=${Date.now()}&u=${OTRO_DUEÑO}`;
          document.body.append(frame4);
          await new Promise((res) => frame4.addEventListener("load", res, { once: true }));
          await sleep(1800);
          const win4 = frame4.contentWindow;
          const doc4 = win4.document;
          const navRoot4 = doc4.querySelector("whiskito-navbar").shadowRoot;
          const card4 = doc4.querySelector("whiskito-donate-card");
          const cardRoot4 = card4.shadowRoot;
          const pedidos4 = [];
          win4.ethereum = {
            request: async ({ method }) => {
              pedidos4.push(method);
              if (method === "eth_requestAccounts" || method === "eth_accounts") return [OTRO_DUEÑO];
              if (method === "eth_chainId") return "0x7a69";
              if (method === "eth_blockNumber") return "0x2";
              throw new Error("método no esperado en modo demo: " + method);
