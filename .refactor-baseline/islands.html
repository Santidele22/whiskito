          navRoot4.querySelector("#connectButton").click();
          await sleep(1500);
          card4.ethPrice = 2000;
          const input4 = cardRoot4.querySelector("#ehtAmount");
          input4.value = "0.002";
          input4.dispatchEvent(new win4.Event("input", { bubbles: true }));
          await sleep(250);
          cardRoot4.querySelector("#fundButton").click();
          await sleep(2200);
          const firmas4 = pedidos4.filter((m) => /sign|sendTransaction|sendRawTransaction/i.test(m));
          check("N18 en demo el dueño de la página puede probar la donación (la guardia no bloquea)",
            firmas4.length === 0 && card4.status === "success" &&
              !/on-chain/i.test(NORM(cardRoot4.querySelector("#txText").textContent)),
            `firmas=${firmas4.length} status=${card4.status} msj=${NORM(cardRoot4.querySelector("#txText").textContent)}`);

          // ── G2. La URL es una INSTRUCCIÓN; la wallet es la REALIDAD ────
          // La página del link se pide con `?chain=31337` (anvil) y una wallet
          // EIP-1193 falsa dice estar en Amoy (80002). Al conectar, la app tiene
          // que PEDIRLE el cambio de red; si la wallet rechaza (4001), no puede
          // salir ninguna transacción y la app tiene que decir el desajuste.
          // Nada de esto toca el RPC público de Amoy: la wallet es un stub y el
          // único nodo que contesta es el anvil local.
          const frameG2a = document.createElement("iframe");
          frameG2a.style.cssText = "width:1440px;height:900px;border:0;position:absolute;left:-10000px";
          frameG2a.src = `/src/donate.html?cb=${Date.now()}&u=${OTRO_DUEÑO}&chain=31337`;
          document.body.append(frameG2a);
          await new Promise((res) => frameG2a.addEventListener("load", res, { once: true }));
          await sleep(1800);
          const winG2a = frameG2a.contentWindow;
          const cardG2a = winG2a.document.querySelector("whiskito-donate-card");
          const cardRootG2a = cardG2a.shadowRoot;
          const pedidosG2a = [];
          winG2a.ethereum = {
            isMetaMask: true,
            request: async ({ method, params }) => {
              pedidosG2a.push({ method, params });
              if (method === "eth_requestAccounts" || method === "eth_accounts") return [DONANTE];
              if (method === "eth_chainId") return "0x13882"; // 80002: la wallet está en Amoy
              if (method === "wallet_switchEthereumChain") {
                const error = new Error("User rejected the request.");
                error.code = 4001;
                throw error;
              }
              if (method === "eth_blockNumber") return "0x2";
              throw new Error("método no esperado: " + method);
            },
            on: () => {},
          };
          cardRootG2a.querySelector("#connectWallet").click();
          await sleep(1800);
          const cambiosG2a = pedidosG2a.filter((p) => p.method === "wallet_switchEthereumChain");
          check("G2a con la wallet en otra red, conectar le PIDE moverse a la red de la página (0x7a69)",
            cambiosG2a.length >= 1 && cambiosG2a[0].params?.[0]?.chainId === "0x7a69",
            `cambios=${JSON.stringify(cambiosG2a)}`);
          // Rechazo de la CONEXIÓN (no guarda de escritura). G2b/G2d dicen sólo
          // esto: `connectWallet()` lanzó al rechazarse el cambio de red, así que
          // quedó sin `walletClient` y por eso no puede salir ninguna firma. NO
          // son evidencia de la guarda `requireSigningNetwork` de `tx.js`: con
          // `walletClient` en `undefined`, `fund()` entra por el atajo
          // `if (demo || !wallet)` de `src/js/solidity/solidity-functions.js:171` y
          // devuelve el recibo demo —nunca se llega a un camino de firma—. La
          // evidencia de esa guarda son G2h/G2i (wallet VIVA y desajuste avisado
          // por `chainChanged`). Acá cada aserción falla si se pide firmar, así
          // que siguen valiendo como regresión: rechazar el cambio de red no
          // puede terminar en una firma.
          check("G2b tras rechazar el cambio de red (4001) la conexión falla y no se firma nada",
            cardG2a.status === "error" &&
              pedidosG2a.every((p) => p.method !== "eth_sendTransaction"),
            `status=${cardG2a.status} métodos=${[...new Set(pedidosG2a.map((p) => p.method))].join(",")}`);
          check("G2c y la app dice el desajuste, con SU mensaje y nombrando las dos redes",
            /tu wallet está en la red/i.test(cardG2a.message ?? "") &&
              /\b80002\b/.test(cardG2a.message ?? "") &&
              /\b31337\b/.test(cardG2a.message ?? ""),
            `status=${cardG2a.status} msj=${cardG2a.message}`);
          // Y si igual se pide donar, tampoco sale nada: sin wallet usable no hay
          // quién firme (la app no puede firmar contra anvil con una wallet que
          // quedó en Amoy).
          const inputG2a = cardRootG2a.querySelector("#ehtAmount");
          inputG2a.value = "0.001";
          inputG2a.dispatchEvent(new winG2a.Event("input", { bubbles: true }));
          await sleep(250);
          cardRootG2a.querySelector("#fundButton").click();
          await sleep(2000);
          check("G2d y donar después de ese rechazo tampoco firma (no hay wallet client)",
            pedidosG2a.every((p) => p.method !== "eth_sendTransaction"),
            `firmas=${pedidosG2a.filter((p) => p.method === "eth_sendTransaction").length} msj=${cardG2a.message}`);

          // ── G2e. La wallet se MUEVE de red DESPUÉS de conectar ────────
          // La app tiene que enterarse por `chainChanged` (sin recargar) y
          // reaccionar: con `?chain=` la URL manda, así que la wallet quedó fuera
          // de la red que la página pide y hay que decirlo.
          const frameG2b = document.createElement("iframe");
          frameG2b.style.cssText = "width:1440px;height:900px;border:0;position:absolute;left:-10000px";
          frameG2b.src = `/src/donate.html?cb=${Date.now()}&u=${OTRO_DUEÑO}&chain=31337`;
          document.body.append(frameG2b);
          await new Promise((res) => frameG2b.addEventListener("load", res, { once: true }));
          await sleep(1800);
          const winG2b = frameG2b.contentWindow;
          const cardG2b = winG2b.document.querySelector("whiskito-donate-card");
          const cardRootG2b = cardG2b.shadowRoot;
          const pedidosG2b = [];
          const oyentesG2b = new Map();
          let redG2b = 31337; // arranca en la MISMA red que pide la página
          winG2b.ethereum = {
            isMetaMask: true,
            request: async ({ method, params }) => {
              pedidosG2b.push({ method, params });
              if (method === "eth_requestAccounts" || method === "eth_accounts") return [DONANTE];
              if (method === "eth_chainId") return "0x" + redG2b.toString(16);
              if (method === "wallet_switchEthereumChain") {
                const error = new Error("User rejected the request.");
                error.code = 4001;
                throw error;
              }
              if (method === "eth_blockNumber") return "0x2";
              throw new Error("método no esperado: " + method);
            },
            on: (evento, handler) => {
              if (!oyentesG2b.has(evento)) oyentesG2b.set(evento, []);
              oyentesG2b.get(evento).push(handler);
            },
          };
          cardRootG2b.querySelector("#connectWallet").click();
          await sleep(1800);
          check("G2e con la wallet en la red de la página, conecta sin pedir ningún cambio",
            cardG2b.viewer?.toLowerCase() === DONANTE.toLowerCase() &&
              !pedidosG2b.some((p) => p.method === "wallet_switchEthereumChain"),
            `viewer=${cardG2b.viewer} métodos=${[...new Set(pedidosG2b.map((p) => p.method))].join(",")}`);
          // El usuario cambia de red en su wallet: MetaMask avisa por `chainChanged`.
          redG2b = 80002;
          for (const handler of oyentesG2b.get("chainChanged") ?? []) handler("0x13882");
          await sleep(1800);
          check("G2f la app se suscribe UNA sola vez a chainChanged y lo sigue sin recargar",
            (oyentesG2b.get("chainChanged") ?? []).length === 1 &&
              pedidosG2b.filter((p) => p.method === "wallet_switchEthereumChain").length >= 1,
            `suscripciones=${(oyentesG2b.get("chainChanged") ?? []).length} cambios=${pedidosG2b.filter((p) => p.method === "wallet_switchEthereumChain").length}`);
          check("G2g y lo dice con su mensaje: la wallet quedó en otra red que la de la página",
            /tu wallet está en la red/i.test(cardG2b.message ?? "") &&
              /\b80002\b/.test(cardG2b.message ?? "") &&
              /\b31337\b/.test(cardG2b.message ?? ""),
            `status=${cardG2b.status} msj=${cardG2b.message}`);

          // ── G2h. La guarda de ESCRITURA: ni simular ni firmar ─────────
          // Acá el cliente de wallet queda VIVO y la guarda de `tx.js` es la
          // ÚNICA capa que puede frenar: la wallet avisa por `chainChanged` que
          // se fue a Amoy, pero su `eth_chainId` todavía contesta 31337 (la
          // carrera real: el evento llega antes de que el provider actualice su
          // estado), así que el chequeo interno de viem —que compara la cadena
          // del cliente contra `eth_chainId`— NO ve el desajuste. Si la app no
          // mirara la red que la wallet avisó, simularía y firmaría.
          const frameG2c = document.createElement("iframe");
          frameG2c.style.cssText = "width:1440px;height:900px;border:0;position:absolute;left:-10000px";
          frameG2c.src = `/src/donate.html?cb=${Date.now()}&u=${OTRO_DUEÑO}&chain=31337`;
          document.body.append(frameG2c);
          await new Promise((res) => frameG2c.addEventListener("load", res, { once: true }));
          await sleep(1800);
          const winG2c = frameG2c.contentWindow;
          const cardG2c = winG2c.document.querySelector("whiskito-donate-card");
          const cardRootG2c = cardG2c.shadowRoot;
          const pedidosG2c = [];
          const oyentesG2c = new Map();
          let bloqueadaG2c = false; // la wallet deja de dar cuentas tras el cambio
          winG2c.ethereum = {
            isMetaMask: true,
            request: async ({ method, params }) => {
              pedidosG2c.push({ method, params });
              if (method === "eth_requestAccounts" || method === "eth_accounts") {
                if (bloqueadaG2c) {
                  const error = new Error("The requested account is not available.");
                  error.code = 4100;
                  throw error;
                }
                return [DONANTE];
              }
              // A propósito: la wallet avisa del cambio por `chainChanged`, pero
              // sigue contestando la red vieja (la carrera).
              if (method === "eth_chainId") return "0x7a69";
              if (method === "eth_sendTransaction") return "0x" + "ef".repeat(32);
              if (method === "eth_blockNumber") return "0x2";
              throw new Error("método no esperado: " + method);
            },
            on: (evento, handler) => {
              if (!oyentesG2c.has(evento)) oyentesG2c.set(evento, []);
              oyentesG2c.get(evento).push(handler);
            },
          };
          cardRootG2c.querySelector("#connectWallet").click();
          await sleep(1800);
          bloqueadaG2c = true;
          for (const handler of oyentesG2c.get("chainChanged") ?? []) handler("0x13882");
          await sleep(1500);
          const inputG2c = cardRootG2c.querySelector("#ehtAmount");
          inputG2c.value = "0.001";
          inputG2c.dispatchEvent(new winG2c.Event("input", { bubbles: true }));
          await sleep(250);
          cardRootG2c.querySelector("#fundButton").click();
          await sleep(2000);
          // Precondición (misma forma que G2f/G2j): si la app no se suscribió a
          // `chainChanged`, el disparo de arriba fue un NO-OP silencioso y esta
          // aserción mediría vacío. Con el conteo adentro, no suscribirse la
          // hace FALLAR en vez de pasar en verde por la razón equivocada.
          check("G2h con la wallet fuera de la red activa, donar no llega a simular ni a firmar",
            (oyentesG2c.get("chainChanged") ?? []).length === 1 &&
              cardG2c.viewer?.toLowerCase() === DONANTE.toLowerCase() &&
              pedidosG2c.every((p) => p.method !== "eth_sendTransaction"),
            `suscripciones=${(oyentesG2c.get("chainChanged") ?? []).length} viewer=${cardG2c.viewer} firmas=${pedidosG2c.filter((p) => p.method === "eth_sendTransaction").length} métodos=${[...new Set(pedidosG2c.map((p) => p.method))].join(",")}`);
          check("G2i y la app dice el desajuste (su propio mensaje, con las dos redes) en vez de fingir una donación",
            (oyentesG2c.get("chainChanged") ?? []).length === 1 &&
              cardG2c.status === "error" &&
              /tu wallet está en la red/i.test(cardG2c.message ?? "") &&
              /\b80002\b/.test(cardG2c.message ?? "") &&
              /\b31337\b/.test(cardG2c.message ?? ""),
            `status=${cardG2c.status} suscripciones=${(oyentesG2c.get("chainChanged") ?? []).length} msj=${cardG2c.message}`);

          // ── G2j. La LANDING también sigue el cambio de red ────────────
          // Mismo caso que G2f/G2g, pero en la landing: el navbar no puede
          // quedar diciendo "Conectado" mientras la wallet está en otra red.
          const frameG2d = document.createElement("iframe");
          frameG2d.style.cssText = "width:1440px;height:900px;border:0;position:absolute;left:-10000px";
          frameG2d.src = `/src/index.html?cb=${Date.now()}&chain=31337`;
          document.body.append(frameG2d);
          await new Promise((res) => frameG2d.addEventListener("load", res, { once: true }));
          await sleep(1800);
          const winG2d = frameG2d.contentWindow;
          const navbarG2d = winG2d.document.querySelector("whiskito-navbar");
          const pedidosG2d = [];
          const oyentesG2d = new Map();
          let redG2d = 31337;
          winG2d.ethereum = {
            isMetaMask: true,
            request: async ({ method, params }) => {
              pedidosG2d.push({ method, params });
              if (method === "eth_requestAccounts" || method === "eth_accounts") return [DONANTE];
              if (method === "eth_chainId") return "0x" + redG2d.toString(16);
              if (method === "wallet_switchEthereumChain") {
                const error = new Error("User rejected the request.");
                error.code = 4001;
                throw error;
              }
              if (method === "eth_blockNumber") return "0x2";
              if (method === "eth_getTransactionReceipt") return null;
              throw new Error("método no esperado: " + method);
            },
            on: (evento, handler) => {
              if (!oyentesG2d.has(evento)) oyentesG2d.set(evento, []);
              oyentesG2d.get(evento).push(handler);
            },
          };
          winG2d.document
            .querySelector("whiskito-navbar")
            .shadowRoot.querySelector("#connectButton")
            .click();
          await sleep(1800);
          check("G2j la landing conecta con la wallet en su red y no pide ningún cambio",
            navbarG2d.connectionState === "connected" &&
              oyentesG2d.get("chainChanged")?.length === 1 &&
              !pedidosG2d.some((p) => p.method === "wallet_switchEthereumChain"),
            `estado=${navbarG2d.connectionState} suscripciones=${oyentesG2d.get("chainChanged")?.length} métodos=${[...new Set(pedidosG2d.map((p) => p.method))].join(",")}`);
          redG2d = 80002;
          // Se captura el estado JUSTO ANTES del disparo: si ya no estaba
          // "connected", el disparo no midió ninguna transición (el default del
          // navbar es "disconnected") y la aserción no vale nada.
          const estadoPreG2d = navbarG2d.connectionState;
          for (const handler of oyentesG2d.get("chainChanged") ?? []) handler("0x13882");
          await sleep(1800);
          check("G2k y cuando la wallet cambia de red, la landing lo sigue sin recargar y no queda 'conectada' contra otra red",
            (oyentesG2d.get("chainChanged") ?? []).length >= 1 &&
              estadoPreG2d === "connected" &&
              navbarG2d.connectionState !== "connected" &&
              pedidosG2d.filter((p) => p.method === "wallet_switchEthereumChain").length >= 1 &&
              pedidosG2d.every((p) => p.method !== "eth_sendTransaction"),
            `estadoPre=${estadoPreG2d} estadoPost=${navbarG2d.connectionState} suscripciones=${(oyentesG2d.get("chainChanged") ?? []).length} cambios=${pedidosG2d.filter((p) => p.method === "wallet_switchEthereumChain").length} firmas=${pedidosG2d.filter((p) => p.method === "eth_sendTransaction").length}`);

          // ── Precondición de L y M: la landing del VISITANTE ───────────
          // L4 (el icono del hero) y M2/M6 (la radio) siempre midieron la landing
          // del visitante; con el dueño conectado desde H esas secciones quedan
          // ocultas y las tres caen. El dueño ya quedó verificado en H/W/N: se
          // desconecta acá (misma espera que C, 600 ms; el click es seguro porque
          // la revocación traga los errores) y L y M recuperan su precondición.
          navRoot.querySelector("#disconnectButton").click();
          await sleep(600);
          check("P8 al desconectar en la landing, la vista del profesional se apaga",
            !doc.body.classList.contains("is-profesional"),
            `class="${doc.body.className}"`);
          check("P9 y las DOS islas del profesional se DESMONTAN (la landing del visitante vuelve a ser el DOM del HTML)",
            doc.querySelector("whiskito-pro-greeting") === null &&
              doc.querySelector("whiskito-history-table") === null,
            (() => {
              const saludo = doc.querySelector("whiskito-pro-greeting");
              const tabla = doc.querySelector("whiskito-history-table");
              if (!saludo && !tabla) return "desmontadas";
              return `quedaron montadas:${saludo ? ` saludo(display=${win.getComputedStyle(saludo).display})` : ""}${tabla ? ` tabla(display=${win.getComputedStyle(tabla).display})` : ""}`;
            })());

          // Y la precondición de la OTRA isla que mide L2: la tabla del historial
          // se desmonta al volver a la vista del visitante (P9 acaba de
          // verificarlo), así que L2 —que cuenta los iconos hidratados de cada
          // isla— la mediría ausente. Se monta un host suelto SÓLO para la
          // medición y se saca al terminar L: el estado de la app no se toca (la
          // tabla queda `display:none` por CSS, y ni el flujo ni el router la
          // ven). Es el mismo criterio con el que L5 recupera su precondición.
          const tablaSonda = doc.createElement("whiskito-history-table");
          doc.body.append(tablaSonda);
          await sleep(120);

          // Y una precondición MÁS de L, que también estaba heredada: L5 pisa el
          // marcador del navbar (`state = "connected"`) y mira sus iconos, pero el
          // navbar sólo se considera conectado con `state === "connected"` Y
          // `account !== ""` (whiskito-navbar.js). Desconectado arriba, la cuenta
          // quedó vacía y L5 mediría el estado vacío en vez del marcador. Se le
          // devuelve la cuenta que tenía mientras el frame estaba conectado: es
          // una propiedad de la ISLA, así que no toca el estado de la app —que
          // sigue desconectada y en la vista del visitante, que es lo que L4 y M
          // necesitan—. La aserción no se toca: se le devuelve su precondición.
          doc.querySelector("whiskito-navbar").account = DUEÑO;
          await sleep(80);

          // ── L. Iconos: Lucide hidratado, y ningún emoji suelto ────
          // El objetivo del cambio era sacar los iconos hardcodeados: acá se
          // comprueba que se hidrataron de verdad —incluidas las 4 islas, que
          // viven en un shadow root— y que no quedó ningún pictograma en lo que
          // el usuario ve. Los ★ del cartel y los 🥃 de SHARE_TEXT/SHARE_TITLE no
          // están en el rango: son tipografía y copy de mensaje, no iconos.
          const EMOJI = /[\u{1F300}-\u{1FAFF}\u{26A0}\u{26D3}\u{2708}\u{2B07}\u{2713}\u{2714}]/gu;
          const islasConSombra = ["whiskito-navbar", "whiskito-donate-card", "whiskito-panel", "whiskito-share-card", "whiskito-radio", "whiskito-history-table"];
          const raices = [doc, ...islasConSombra.map((n) => doc.querySelector(n)?.shadowRoot).filter(Boolean)];

          const sinHidratar = raices.flatMap((r) => [...r.querySelectorAll("i[data-lucide]")])
            .map((el) => el.getAttribute("data-lucide"));
          check("L1 todos los marcadores data-lucide se hidrataron",
            sinHidratar.length === 0,
            sinHidratar.length ? `quedaron sin reemplazar: ${[...new Set(sinHidratar)].join(", ")}` : "ninguno");

          // `doc.querySelectorAll` NO atraviesa shadow roots: lo que devuelve es
          // exactamente lo que hay en light DOM.
          //
          // Los números son los marcadores `data-lucide` de cada template. Se
          // comparan con los SVG que existen DESPUÉS de pintar, así que esta
          // aserción caza al que borra un icono: a un `<button>` que lleva el
          // icono adentro y además se pinta con `textContent` (le pasó a
          // #copyButton), `update()` —que corre justo después de hidratar— le
          // saca el SVG y el conteo baja.
          // (El navbar son SUS TRES iconos: el vaso, el de conectar y el del
          // marcador de conectado —el control "Volver al inicio" sólo existe con
          // `base`, o sea fuera de la landing, y N2c exige que acá no esté—. La
          // tarjeta lleva el del aviso de demo y la tabla del historial 3: el del
          // encabezado, el de conectar y el de "Retirar todo".)
          // El navbar son 3: el template tiene cuatro marcadores (vaso, el del
          // control de volver —que vive en un <template data-back-icon> y sólo se
          // clona con `base`, o sea fuera de la landing—, el de conectar y el del
          // marcador de conectado), y acá el control de volver no se monta porque
          // el navbar de la landing no tiene `base` (N2c exige que `backHome` esté
          // oculto). Antes eran 4 porque contaba el icono del botón "Mi Panel",
          // que se borró con el modal.
          const ESPERADOS = { "whiskito-navbar": 3, "whiskito-donate-card": 7, "whiskito-panel": 6, "whiskito-share-card": 15, "whiskito-radio": 8, "whiskito-history-table": 3 };
          const conteos = Object.entries(ESPERADOS).map(([host, esperado]) => ({
            host, esperado,
            hay: doc.querySelector(host)?.shadowRoot?.querySelectorAll("svg.icon").length ?? -1,
          }));
          const iconosLight = doc.querySelectorAll("svg.icon").length; // 10 hero + 3 line-up + 3 footer
          check("L2 cada isla conserva todos sus iconos hidratados (ninguno borrado al pintar)",
            iconosLight === 16 && conteos.every((c) => c.hay === c.esperado),
            `light=${iconosLight} (esperado 16) · ` +
              conteos.map((c) => `${c.host.replace("whiskito-", "")}=${c.hay}/${c.esperado}`).join(" "));

          const textoVisible = raices.map((r) => r.body?.textContent ?? r.textContent ?? "").join(" ");
          const emojis = textoVisible.match(EMOJI) ?? [];
          check("L3 no quedó ningún emoji pictográfico en lo renderizado",
            emojis.length === 0,
            emojis.length ? `encontrados: ${[...new Set(emojis)].join(" ")}` : "ninguno");

          // El icono tiene que medir 1em —o sea, heredar el font-size del slot—
          // y pintarse con el color del slot, no con uno propio.
          const tick = doc.querySelector(".hero-trust .tick");
          const tickCss = tick ? win.getComputedStyle(tick) : null;
          check("L4 el icono mide 1em y toma el color del slot",
            Boolean(tickCss) &&
              Math.abs(parseFloat(tickCss.width) - parseFloat(tickCss.fontSize)) < 0.6 &&
              tickCss.color === "rgb(74, 122, 61)",
            tick ? `ancho=${tickCss.width} font-size=${tickCss.fontSize} color=${tickCss.color}` : "no encontré .hero-trust .tick");

          // Un icono con marcador sigue gobernado por el pintado de la isla:
          // conectado = se ve el check y se esconde la billetera; y al revés.
          const iconoWallet = navRoot.querySelector('svg[data-lucide="wallet"]');
          const iconoCheck = navRoot.querySelector('svg[data-lucide="circle-check"]');
          navbar.connectionState = "connected";
          await sleep(80);
          const enConectado = iconoWallet?.hasAttribute("hidden") === true && iconoCheck?.hasAttribute("hidden") === false;
          navbar.connectionState = "disconnected";
          await sleep(80);
          const enDesconectado = iconoWallet?.hasAttribute("hidden") === false && iconoCheck?.hasAttribute("hidden") === true;
          check("L5 el marcador de estado sigue gobernando los iconos del navbar",
            Boolean(iconoWallet && iconoCheck) && enConectado && enDesconectado,
            `conectado=${enConectado} desconectado=${enDesconectado}`);

          // La tabla-sonda ya cumplió su única función (L2): se saca para que M
          // vuelva a ver la landing del visitante tal como la dejó el flujo.
          tablaSonda.remove();
          await sleep(80);

          // ── M. La radio ───────────────────────────────────────────
          // Se prueban las reglas de producto de §6.1 que sí son deterministas:
          // que arranque cerrada, que NO haya nada de YouTube hasta que alguien
          // pida música, que sus controles sean alcanzables y que el widget no se
          // mueva al scrollear. La cadena real contra YouTube (cargar la API,
          // crear el player, que suene) se verifica aparte, con la sonda
          // `zoom.html?radio=play`, para no meter red en el harness.
          const radioIsla = doc.querySelector("whiskito-radio");
          const radioRoot = radioIsla.shadowRoot ?? radioIsla;
          const radioTrigger = radioRoot.querySelector("#radioTrigger");
          const radioPanel = radioRoot.querySelector("#radioPanel");
          const radioVol = radioRoot.querySelector("#radioVolume");
          const radioPlay = radioRoot.querySelector("#radioPlay");
          const radioStop = radioRoot.querySelector("#radioStop");

          check("M1 la radio arranca cerrada y sin nada de YouTube cargado",
            Boolean(radioPanel?.hasAttribute("hidden")) &&
              radioRoot.querySelectorAll("iframe").length === 0 &&
              !doc.querySelector('script[src*="iframe_api"]'),
            `panel[hidden]=${radioPanel?.hasAttribute("hidden")} iframes=${radioRoot.querySelectorAll("iframe").length} ` +
              `script=${Boolean(doc.querySelector('script[src*="iframe_api"]'))}`);

          const cajaTrigger = radioTrigger.getBoundingClientRect();
          const estiloTrigger = win.getComputedStyle(radioTrigger);
          check("M2 el disparador está fijo abajo a la izquierda (y no choca con compartir)",
            estiloTrigger.position === "fixed" &&
              Math.abs(cajaTrigger.left - 20) <= 1 &&
              Math.abs(win.innerHeight - cajaTrigger.bottom - 20) <= 1,
            `position=${estiloTrigger.position} left=${Math.round(cajaTrigger.left)} ` +
              `bottom=${Math.round(win.innerHeight - cajaTrigger.bottom)}`);

          // Ningún ancestro puede llevar transform/filter/will-change: si no, el
          // `fixed` deja de seguir el scroll (la trampa que ya se pagó en H).
          let ancestroSucio = null;
          for (let n = radioTrigger; n; n = n.parentElement ?? n.getRootNode()?.host ?? null) {
            const css = win.getComputedStyle(n);
            if (css.transform !== "none" || css.filter !== "none" || css.willChange !== "auto") {
              ancestroSucio = `${n.tagName ?? "?"}${n.id ? "#" + n.id : ""}`;
              break;
            }
          }
          check("M3 ningún ancestro del widget lleva transform/filter/will-change", ancestroSucio === null, ancestroSucio ?? "limpio");

          radioTrigger.click();
          await sleep(150);
          check("M4 el click abre el panel",
            radioIsla.abierto === true && !radioPanel.hasAttribute("hidden"),
            `abierto=${radioIsla.abierto} hidden=${radioPanel.hasAttribute("hidden")}`);

          radioVol.value = "70";
          radioVol.dispatchEvent(new win.Event("input", { bubbles: true }));
          await sleep(100);
          check("M5 el slider escribe el volumen en el componente", Number(radioIsla.volumen) === 70, `volumen=${radioIsla.volumen}`);

          const centro = (el) => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
          const alcanzable = (el) => {
            if (!el || el.getClientRects().length === 0) return false;
            const [x, y] = centro(el);
            const arriba = radioRoot.elementFromPoint(x, y);
            return arriba === el || el.contains(arriba);
          };
          check("M6 play, parar y volumen son alcanzables de verdad (no tapados)",
            alcanzable(radioPlay) && alcanzable(radioStop) && alcanzable(radioVol),
            `play=${alcanzable(radioPlay)} stop=${alcanzable(radioStop)} vol=${alcanzable(radioVol)}`);

          const yAntes = radioTrigger.getBoundingClientRect().top;
          win.scrollTo({ top: 1400, behavior: "instant" });
          await sleep(150);
          const yDespues = radioTrigger.getBoundingClientRect().top;
          check("M7 el widget no se mueve al scrollear 1400px", Math.abs(yAntes - yDespues) <= 1,
            `antes=${Math.round(yAntes)} después=${Math.round(yDespues)}`);
          win.scrollTo({ top: 0, behavior: "instant" });
          await sleep(100);

          // Escape cierra. Se despacha sobre el panel (que burbujea, compuesto,
          // hasta un listener en document) y también sobre el documento, para no
          // depender de dónde lo escuche la isla.
          let escapeRompe = "";
          try {
            radioPanel.dispatchEvent(new win.KeyboardEvent("keydown", { key: "Escape", bubbles: true, composed: true }));
            win.document.dispatchEvent(new win.KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
          } catch (error) { escapeRompe = String(error && error.message); }
          await sleep(120);
          check("M8 Escape cierra el panel", escapeRompe === "" && radioPanel.hasAttribute("hidden"),
            escapeRompe || `hidden=${radioPanel.hasAttribute("hidden")}`);

          // Pedir música no puede tirar excepción, con YouTube disponible o no:
          // si la API no carga, la isla tiene que quedar en "error", no romperse.
          let playRompe = "";
          try { radioTrigger.click(); await sleep(150); radioPlay.click(); } catch (error) { playRompe = String(error && error.message); }
          await sleep(200);
          check("M9 pedir música no rompe y saca a la isla de 'apagado'",
            playRompe === "" && radioIsla.estado !== "apagado",
            playRompe || `estado=${radioIsla.estado}`);

          const geometria =
            `GEO card=${geo(cardRoot.querySelector(".donate-card"))}` +
            ` navbar=${geo(navRoot.querySelector(".navbar"))}` +
            ` panel=${geo(panelRoot.querySelector(".receipt"))}` +
            ` ancla#panel(block)=${y} ancla#panel(contents)=${yConContents}`;

          // ── Reporte ───────────────────────────────────────────────
          const fallos = results.filter((r) => !r.ok);
          const reporte = fallos.length
            ? `FALLOS(${fallos.length}/${results.length}) :: ` +
              fallos.map((f) => `${f.name}${f.extra ? " <" + f.extra + ">" : ""}`).join(" ;; ")
            : `OK(${results.length}/${results.length}) :: todas las islas reaccionan como se espera`;
          document.getElementById("out").textContent =
            reporte + " ;; " + geometria + "\n\n" + results.map((r) => `${r.ok ? "✓" : "✗"} ${r.name}${r.ok ? "" : " — " + r.extra}`).join("\n");
          try {
            await fetch("/__report__?d=" + encodeURIComponent((reporte + " ;; " + geometria).slice(0, 6000)), { mode: "no-cors" });
          } catch (e) {
            /* best-effort: el reporte también queda en el <pre> */
          }
        } catch (error) {
          const reporte = "ERROR :: " + (error && error.message ? error.message : String(error));
          document.getElementById("out").textContent = reporte;
          try {
            await fetch("/__report__?d=" + encodeURIComponent(reporte), { mode: "no-cors" });
          } catch (e) {}
        }
      })();
    </script>
  </body>
</html>
